<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Agent Shell</title>
<link rel="apple-touch-icon" href="/icon.png" />
<link rel="stylesheet" href="/vendor/xterm/xterm.css" />
<style>
  :root {
    --bg: #0d1117;
    --panel: #161b22;
    --border: #30363d;
    --text: #e6edf3;
    --dim: #8b949e;
    --accent: #3fb950;
    --accent2: #58a6ff;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; background: var(--bg); color: var(--text); font: 13px/1.4 -apple-system, "SF Mono", Menlo, monospace; }
  #app { display: flex; flex-direction: column; height: 100%; position: relative; }
  header {
    display: flex; align-items: center; gap: 10px;
    padding: 8px 14px; background: var(--panel); border-bottom: 1px solid var(--border);
    flex: none;
  }
  header .brand { font-weight: 700; letter-spacing: 0.4px; }
  header .brand .dot { color: var(--accent); }
  #active-label { color: var(--dim); margin-left: 8px; }
  button { font: inherit; cursor: pointer; }
  .hbtn {
    padding: 4px 10px; border-radius: 6px; border: 1px solid var(--border);
    background: transparent; color: var(--dim);
  }
  .hbtn:hover { color: var(--text); border-color: var(--dim); }
  .hbtn.on { color: var(--accent); border-color: var(--accent); }
  #agent-btn { margin-left: auto; }
  #main { flex: 1; display: flex; min-height: 0; }
  #sidebar {
    width: 0; flex: none; overflow: hidden;
    background: var(--panel); border-right: 1px solid transparent;
    display: flex; flex-direction: column;
    transition: width 0.15s ease;
  }
  #sidebar.open { width: 280px; border-right-color: var(--border); }
  #sidebar-head {
    display: flex; align-items: center; justify-content: space-between; gap: 8px;
    padding: 8px 12px; border-bottom: 1px solid var(--border); flex: none;
    white-space: nowrap;
  }
  /* rtl outer + ltr inner keeps the tail of a long path visible; the
     ellipsis lands on the left, and the focused node always shows. */
  #crumbs { overflow: hidden; text-overflow: ellipsis; direction: rtl; text-align: left; }
  #crumb-line { direction: ltr; unicode-bidi: isolate; }
  .crumb {
    background: none; border: none; padding: 0;
    color: var(--dim); font-size: 12px;
  }
  .crumb:hover { color: var(--accent2); }
  .crumb.here { color: var(--text); }
  .crumb-sep { color: var(--dim); font-size: 12px; margin: 0 1px; }
  #filter-btn { font-size: 11px; padding: 3px 8px; }
  #tree { flex: 1; overflow: auto; padding: 6px 4px; white-space: nowrap; }
  .node-row {
    display: flex; align-items: center; gap: 4px;
    padding: 2px 4px; border-radius: 5px; color: var(--text);
  }
  .node-row:hover { background: rgba(255,255,255,0.04); }
  .caret {
    width: 16px; flex: none; text-align: center; color: var(--dim);
    background: none; border: none; padding: 0;
  }
  .caret.leaf { visibility: hidden; }
  .node-name { background: none; border: none; color: inherit; padding: 1px 2px; }
  .node-name:hover { color: var(--accent2); }
  .node-children { margin-left: 14px; }
  /* Sessions are the living rows of the tree: nodes are dim structure, a
     session row is a piece of work with a state dot. Agent state from screen
     diff: pulsing green = working (motion means activity), steady amber =
     waiting for you, dim hollow = plain shell / agent exited. Services
     (@tangent_kind=service, e.g. a dev server) skip the diff: steady blue =
     running, red hollow = the command exited. */
  .sess-row {
    display: flex; align-items: center; gap: 6px;
    padding: 2px 4px 2px 18px; border-radius: 5px; color: var(--text);
    cursor: pointer;
  }
  .sess-row:hover { background: rgba(255,255,255,0.04); }
  .sess-dot { flex: none; width: 10px; text-align: center; font-size: 9px; color: var(--dim); }
  .sess-row.working .sess-dot { color: var(--accent); animation: chip-pulse 1.1s ease-in-out infinite; }
  .sess-row.waiting .sess-dot { color: #e3b341; }
  .sess-row.service .sess-dot { color: var(--accent2); }
  .sess-row.stopped .sess-dot { color: #f85149; }
  .sess-row.active { background: var(--accent2); color: #04121f; font-weight: 600; }
  .sess-row.active .sess-dot { color: #04121f; animation: none; }
  @keyframes chip-pulse { 50% { opacity: 0.2; } }
  /* Collapsed subtree rollup: one dot on the node row in the most urgent
     state below it, so a waiting agent shows through any collapsed parent. */
  .rollup { margin-left: 6px; font-size: 9px; color: var(--dim); }
  .rollup.working { color: var(--accent); animation: chip-pulse 1.1s ease-in-out infinite; }
  .rollup.waiting { color: #e3b341; }
  .rollup.service { color: var(--accent2); }
  .rollup.stopped { color: #f85149; }
  /* A node's home agent lives on the node row itself: the node is the unit
     you talk to, its home session is an implementation detail. Same state
     colors as session dots. */
  .home-dot {
    margin-left: 4px; padding: 0 4px; border-radius: 4px;
    background: none; border: none; color: var(--dim); font-size: 11px;
  }
  .home-dot:hover { color: var(--text); }
  .home-dot.working { color: var(--accent); animation: chip-pulse 1.1s ease-in-out infinite; }
  .home-dot.waiting { color: #e3b341; }
  .home-dot.active { background: var(--accent2); color: #04121f; }
  .add-btn {
    visibility: hidden; margin-left: 4px; padding: 0 5px; border-radius: 4px;
    background: none; border: none; color: var(--dim); font-size: 13px;
  }
  .node-row:hover .add-btn { visibility: visible; }
  .add-btn:hover { color: var(--accent); }
  .kill-btn {
    visibility: hidden; margin-left: auto; padding: 0 5px; border-radius: 4px;
    background: none; border: none; color: var(--dim); font-size: 11px;
  }
  .sess-row:hover .kill-btn { visibility: visible; }
  .kill-btn:hover { color: #f85149; }
  .sess-row.active .kill-btn { color: #04121f; }
  .sess-row.spawn { cursor: default; flex-wrap: wrap; }
  .sess-row.spawn input {
    font: inherit; width: 130px; padding: 1px 6px; border-radius: 4px;
    background: var(--bg); border: 1px solid var(--border); color: var(--text);
  }
  .sess-row.spawn input:focus { outline: none; border-color: var(--accent2); }
  .spawn-hint { color: #e3b341; font-size: 11px; }
  #unfiled { flex: none; border-top: 1px solid var(--border); padding: 8px 12px; }
  #unfiled:empty { display: none; }
  #unfiled .title { color: var(--dim); font-size: 11px; text-transform: uppercase; letter-spacing: 1px; margin-bottom: 4px; }
  #unfiled .sess-row { padding-left: 4px; }
  #settings, #agent-panel {
    position: absolute; top: 44px; right: 10px; z-index: 10;
    width: 380px; padding: 10px 14px;
    background: var(--panel); border: 1px solid var(--border); border-radius: 8px;
    box-shadow: 0 8px 24px rgba(0, 0, 0, 0.5);
  }
  #settings[hidden], #agent-panel[hidden] { display: none; }
  #agent-input {
    width: 100%; margin-bottom: 6px; padding: 4px 8px; border-radius: 6px;
    background: var(--bg); border: 1px solid var(--border); color: var(--text); font: inherit;
  }
  #agent-input:focus { outline: none; border-color: var(--accent2); }
  .agent-row { display: flex; align-items: center; gap: 8px; }
  .agent-cmd {
    flex: 1; text-align: left; background: none; border: none;
    color: var(--text); padding: 3px 4px; border-radius: 5px;
  }
  .agent-cmd:hover { color: var(--accent2); }
  .agent-row.current .agent-cmd { color: var(--accent); }
  .agent-del { background: none; border: none; color: var(--dim); padding: 0 4px; }
  .agent-del:hover { color: var(--text); }
  .s-title {
    display: flex; justify-content: space-between; align-items: center;
    color: var(--dim); font-size: 11px; text-transform: uppercase; letter-spacing: 1px;
    margin-bottom: 6px;
  }
  #s-reset { background: none; border: none; color: var(--dim); font-size: 11px; text-transform: none; letter-spacing: 0; }
  #s-reset:hover { color: var(--accent2); }
  .s-row { display: flex; align-items: center; gap: 8px; padding: 4px 0; }
  .s-label { flex: 1; }
  .s-when { color: var(--dim); font-size: 11px; width: 52px; }
  .s-chord {
    min-width: 92px; text-align: center; padding: 3px 8px; border-radius: 6px;
    border: 1px solid var(--border); background: var(--bg); color: var(--text);
  }
  .s-chord.recording { border-color: var(--accent2); color: var(--accent2); }
  .s-chord.unbound { color: var(--dim); }
  .s-note { font-size: 10px; color: var(--dim); width: 84px; text-align: right; }
  .s-hint { color: var(--dim); font-size: 11px; margin-top: 8px; }
  #mic-btn.rec { color: #f85149; border-color: #f85149; animation: chip-pulse 1.1s ease-in-out infinite; }
  /* Voice HUD: one pill, bottom center. listening (red) -> transcribing
     (blue) -> what happened (green) or what went wrong (amber). */
  #voice-hud {
    position: absolute; left: 50%; bottom: 20px; transform: translateX(-50%);
    z-index: 30; display: none; align-items: center; gap: 8px;
    max-width: min(680px, 85%); padding: 7px 16px; border-radius: 999px;
    background: var(--panel); border: 1px solid var(--border);
    box-shadow: 0 8px 24px rgba(0, 0, 0, 0.5); font-size: 12px;
  }
  #voice-hud.show { display: flex; }
  #voice-hud .vh-dot { flex: none; font-size: 10px; color: var(--dim); }
  #voice-hud.listening .vh-dot { color: #f85149; animation: chip-pulse 1.1s ease-in-out infinite; }
  #voice-hud.busy .vh-dot { color: var(--accent2); animation: chip-pulse 1.1s ease-in-out infinite; }
  #voice-hud.done .vh-dot { color: var(--accent); }
  #voice-hud.error .vh-dot { color: #e3b341; }
  #voice-hud .vh-text { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  /* Typed command bar: the voice grammar over a keyboard. Same spot as the
     HUD so both lanes read as one surface. */
  #cmd-bar {
    position: absolute; left: 50%; bottom: 20px; transform: translateX(-50%);
    z-index: 31; width: min(680px, 85%); padding: 7px 12px; border-radius: 999px;
    background: var(--panel); border: 1px solid var(--accent2);
    box-shadow: 0 8px 24px rgba(0, 0, 0, 0.5);
  }
  #cmd-bar[hidden] { display: none; }
  #cmd-bar input {
    width: 100%; background: none; border: none; outline: none;
    color: var(--text); font: inherit;
  }
  #terms { flex: 1; position: relative; min-height: 0; }
  .term-host { position: absolute; inset: 0; padding: 8px; display: none; }
  .term-host.visible { display: block; }
  .xterm { height: 100%; }
</style>
</head>
<body>
<div id="app">
  <header>
    <button id="tree-btn" class="hbtn" title="project tree">☰</button>
    <span class="brand"><span class="dot">●</span> agent shell</span>
    <span id="active-label"></span>
    <button id="agent-btn" class="hbtn" title="orchestrator agent, click to switch"></button>
    <button id="mic-btn" class="hbtn" title="voice — hold ⌥ and speak (release to send), or tap ⌥ to latch (tap again to send). ⇧ or ↑ while holding locks the recording.">🎙</button>
    <button id="caffeine-btn" class="hbtn" title="keep mac awake (caffeinate -di)">☕</button>
    <button id="keys-btn" class="hbtn" title="keyboard shortcuts">⌘</button>
  </header>
  <div id="settings" hidden>
    <div class="s-title">keyboard shortcuts <button id="s-reset">reset defaults</button></div>
    <div id="s-rows"></div>
    <div class="s-hint">click a chord, then press the new keys. esc cancels, backspace unbinds.</div>
  </div>
  <div id="agent-panel" hidden>
    <div class="s-title">orchestrator agent</div>
    <input id="agent-input" placeholder="command, e.g. claude-otto or pi" spellcheck="false" />
    <div id="agent-rows"></div>
    <div class="s-hint">any command, alias, or flags your shell understands. switching kills the running chat agent and respawns chat with the new command.</div>
  </div>
  <div id="main">
    <div id="sidebar">
      <div id="sidebar-head">
        <span id="crumbs"></span>
        <button id="filter-btn" class="hbtn" title="show only nodes with running sessions">● sessions</button>
      </div>
      <div id="tree"></div>
      <div id="unfiled"></div>
    </div>
    <div id="terms"></div>
  </div>
  <div id="voice-hud"><span class="vh-dot">●</span><span class="vh-text"></span></div>
  <div id="cmd-bar" hidden><input id="cmd-input" placeholder="type what you'd say — e.g. “megabranch, run the client build”" spellcheck="false" /></div>
</div>
<script src="/vendor/xterm/xterm.js"></script>
<script src="/vendor/xterm/addon-fit.js"></script>
<script src="/keymap.js"></script>
<script src="/config.js"></script>
<script>
const CHAT = window.CHAT_SESSION ?? "chat";
const terms = new Map(); // session name -> {term, fit, ws, host}
let active = null;

const termsEl = document.getElementById("terms");
const treeBtn = document.getElementById("tree-btn");
const sidebarEl = document.getElementById("sidebar");
const treeEl = document.getElementById("tree");
const unfiledEl = document.getElementById("unfiled");
const filterBtn = document.getElementById("filter-btn");
const crumbsEl = document.getElementById("crumbs");
const activeLabel = document.getElementById("active-label");

function connect(session) {
  if (terms.has(session)) return terms.get(session);
  const host = document.createElement("div");
  host.className = "term-host";
  termsEl.appendChild(host);

  const term = new Terminal({
    fontFamily: '"SF Mono", Menlo, monospace',
    fontSize: 13,
    theme: { background: "#0d1117", foreground: "#e6edf3", cursor: "#3fb950" },
    cursorBlink: true,
    scrollback: 5000,
  });
  const fit = new FitAddon.FitAddon();
  term.loadAddon(fit);
  term.open(host);
  fit.fit();

  const ws = new WebSocket(
    `ws://${location.host}/term?session=${encodeURIComponent(session)}&cols=${term.cols}&rows=${term.rows}`
  );
  ws.onopen = () => ws.send("\x00resize:" + term.cols + "x" + term.rows);
  ws.onmessage = (e) => term.write(e.data);
  const connectedAt = Date.now();
  ws.onclose = () => {
    // Session client ended (e.g. session was killed): drop the terminal and
    // fall back to chat.
    dispose(session);
    if (active === session && !(session === CHAT && chatDiedFast(connectedAt))) show(CHAT);
    renderSidebar();
  };
  // Shift+Enter inserts a newline instead of submitting: xterm would send a
  // plain \r, so send ESC+\r (what Claude Code's /terminal-setup binding
  // emits) which the agent treats as a literal newline.
  term.attachCustomKeyEventHandler((e) => {
    if (e.type === "keydown" && e.key === "Enter" && e.shiftKey) {
      if (ws.readyState === 1) ws.send("\x1b\r");
      return false;
    }
    return true;
  });
  term.onData((d) => { if (ws.readyState === 1) ws.send(d); });
  term.onResize(({ cols, rows }) => {
    if (ws.readyState === 1) ws.send("\x00resize:" + cols + "x" + rows);
  });

  const entry = { term, fit, ws, host };
  terms.set(session, entry);
  return entry;
}

// A broken agent command makes the chat session die the moment it spawns,
// and blind reconnection would spin in a spawn/die loop. Three fast deaths
// in a row stop the auto-reconnect and open the agent picker instead;
// switching (or re-picking the current agent) reconnects.
let chatDeaths = 0;
function chatDiedFast(connectedAt) {
  if (Date.now() - connectedAt > 1500) {
    chatDeaths = 0;
    return false;
  }
  if (++chatDeaths < 3) return false;
  chatDeaths = 0;
  alert(`chat agent "${agentCmd}" keeps dying right after start. pick another command.`);
  if (agentPanel.hidden) agentBtn.onclick();
  return true;
}

function dispose(session) {
  const e = terms.get(session);
  if (!e) return;
  terms.delete(session);
  try { e.ws.onclose = null; e.ws.close(); } catch {}
  e.term.dispose();
  e.host.remove();
}

function show(session) {
  const entry = connect(session);
  active = session;
  for (const [name, e] of terms) e.host.classList.toggle("visible", name === session);
  activeLabel.textContent = session;
  requestAnimationFrame(() => { entry.fit.fit(); entry.term.focus(); });
  renderSidebar();
}

// Detach only: close our client connection, keep the tmux session alive.
// Reached via the close-session shortcut and the voice close_view action;
// "back to chat" is otherwise just clicking the root node's home in the tree.
function closeSessionView() {
  if (active === CHAT) return;
  dispose(active);
  show(CHAT);
}

function refitActive() {
  const e = active && terms.get(active);
  if (e) { e.fit.fit(); e.term.focus(); }
}

treeBtn.onclick = () => {
  sidebarEl.classList.toggle("open");
  treeBtn.classList.toggle("on", sidebarEl.classList.contains("open"));
};
sidebarEl.addEventListener("transitionend", refitActive);

// ---- project tree sidebar ----

let treeNodes = [];      // nested {name, path, children} from /api/tree
let lastSessions = [];
let filterOn = false;    // show only nodes with running sessions (plus ancestors)
let focusPath = null;    // node shown as the tree root; null = whole vault
const expanded = new Set();

function findNode(path) {
  let nodes = treeNodes;
  let found = null;
  for (const part of (path ?? "").split("/")) {
    found = nodes.find((n) => n.name === part);
    if (!found) return null;
    nodes = found.children;
  }
  return found;
}

function focusNode(path) {
  focusPath = path;
  if (path) expanded.add(path);
  renderSidebar();
}

async function refreshTree() {
  try {
    const res = await fetch("/api/tree");
    const { nodes } = await res.json();
    treeNodes = nodes;
    renderSidebar();
  } catch {}
}

async function refreshSessions() {
  try {
    const res = await fetch("/api/sessions");
    const { agent, caffeinate, voice, sessions } = await res.json();
    if (agent) setAgentCmd(agent);
    setCaffeineState(caffeinate);
    micBtn.style.display = voice === false ? "none" : "";
    lastSessions = sessions;
    renderSidebar();
  } catch {}
}

// Home sessions render on the node row itself, not as work-session chips.
function sessionsForNode(path) {
  return lastSessions.filter((s) => !s.isChat && s.node === path && s.kind !== "home");
}

function homeFor(path) {
  return lastSessions.find((s) => s.kind === "home" && s.node === path);
}

const STATE_HINT = {
  working: "agent working",
  waiting: "agent waiting for you",
  shell: "shell (no agent running)",
  service: "service running",
  stopped: "service stopped (open to restart)",
};

function sessionRow(s) {
  const row = document.createElement("div");
  row.className =
    "sess-row" + (active === s.name ? " active" : "") + (s.state ? " " + s.state : "");
  row.title = STATE_HINT[s.state] ?? "";
  const dot = document.createElement("span");
  dot.className = "sess-dot";
  dot.textContent = ["working", "waiting", "service"].includes(s.state) ? "●" : "○";
  const name = document.createElement("span");
  name.textContent = s.name;
  const kill = document.createElement("button");
  kill.className = "kill-btn";
  kill.textContent = "✕";
  kill.title = "kill tmux session";
  kill.onclick = (e) => {
    e.stopPropagation();
    killSession(s.name);
  };
  row.append(dot, name, kill);
  row.onclick = () => show(s.name);
  return row;
}

// ---- spawn a session from the tree (the + on a node row) ----

let spawningNode = null; // node path with the name input open, or null
let spawnError = null;

function openSpawn(path) {
  spawningNode = path;
  spawnError = null;
  expanded.add(path);
  renderSidebar();
  treeEl.querySelector(".sess-row.spawn input")?.focus();
}

function closeSpawn() {
  spawningNode = null;
  spawnError = null;
  renderSidebar();
}

async function doSpawn(node, name) {
  const res = await fetch("/api/spawn", {
    method: "POST",
    headers: { "content-type": "application/json" },
    body: JSON.stringify({ node, name }),
  });
  if (!res.ok) {
    spawnError = (await res.json()).error ?? "spawn failed " + res.status;
    renderSidebar(true);
    treeEl.querySelector(".sess-row.spawn input")?.focus();
    return;
  }
  closeSpawn();
  await refreshSessions();
  show(name);
}

function spawnInputRow(node) {
  const row = document.createElement("div");
  row.className = "sess-row spawn";
  const dot = document.createElement("span");
  dot.className = "sess-dot";
  dot.textContent = "○";
  const input = document.createElement("input");
  input.placeholder = "work name…";
  input.onkeydown = (e) => {
    e.stopPropagation();
    if (e.key === "Escape") closeSpawn();
    if (e.key === "Enter" && input.value.trim()) {
      doSpawn(node.path, input.value.trim().toLowerCase().replace(/[^a-z0-9-]+/g, "-"));
    }
  };
  // A stale error hint stops meaning anything once the user edits the name;
  // drop it in place rather than re-rendering, so the input keeps focus.
  input.oninput = () => {
    if (!spawnError) return;
    spawnError = null;
    row.querySelector(".spawn-hint")?.remove();
  };
  input.onblur = () => { if (!spawnError) closeSpawn(); };
  row.append(dot, input);
  if (spawnError) {
    const hint = document.createElement("span");
    hint.className = "spawn-hint";
    hint.textContent = spawnError;
    row.appendChild(hint);
  }
  return row;
}

// Most urgent agent state in a node's subtree, for the collapsed rollup dot.
// Urgency: waiting for you beats a dead service beats working beats a live
// service beats a plain shell.
const STATE_RANK = { waiting: 5, stopped: 4, working: 3, service: 2, shell: 1 };
function subtreeSessions(path) {
  return lastSessions.filter(
    (s) => !s.isChat && s.node && (s.node === path || s.node.startsWith(path + "/"))
  );
}
function subtreeState(path) {
  let best = null;
  for (const s of subtreeSessions(path)) {
    if ((STATE_RANK[s.state] ?? 0) > (STATE_RANK[best] ?? 0)) best = s.state;
  }
  return best;
}

// A node passes the session filter when a session sits on it or anywhere in
// its subtree, so ancestors of session nodes always stay visible.
function subtreeHasSession(path) {
  return lastSessions.some(
    (s) => !s.isChat && s.node && (s.node === path || s.node.startsWith(path + "/"))
  );
}

function expandToSessions(nodes) {
  for (const n of nodes) {
    if (subtreeHasSession(n.path)) {
      expanded.add(n.path);
      expandToSessions(n.children);
    }
  }
}

filterBtn.onclick = () => {
  filterOn = !filterOn;
  filterBtn.classList.toggle("on", filterOn);
  if (filterOn) expandToSessions(treeNodes);
  renderSidebar();
};

function renderNode(node, container) {
  if (filterOn && !subtreeHasSession(node.path)) return;
  const row = document.createElement("div");
  row.className = "node-row";

  const caret = document.createElement("button");
  const hasKids = node.children.length > 0;
  caret.className = "caret" + (hasKids ? "" : " leaf");
  caret.textContent = expanded.has(node.path) ? "▾" : "▸";
  caret.onclick = () => {
    if (expanded.has(node.path)) expanded.delete(node.path);
    else expanded.add(node.path);
    renderSidebar();
  };
  row.appendChild(caret);

  const name = document.createElement("button");
  name.className = "node-name";
  name.textContent = node.name;
  name.title = "focus " + node.path;
  name.onclick = () => focusNode(node.path);
  row.appendChild(name);

  // The node's home agent, if one is live: the node's own presence, distinct
  // from the work sessions beneath it.
  const home = homeFor(node.path);
  if (home) {
    const dot = document.createElement("button");
    dot.className = "home-dot" + (home.state ? " " + home.state : "") + (active === home.name ? " active" : "");
    dot.textContent = "⌂";
    dot.title = "home agent — " + (STATE_HINT[home.state] ?? "");
    dot.onclick = () => show(home.name);
    row.appendChild(dot);
  }

  // A collapsed node hides its subtree's sessions, so it wears one rollup
  // dot in the most urgent state below it.
  const collapsed = hasKids && !expanded.has(node.path);
  if (collapsed) {
    const inside = subtreeSessions(node.path);
    if (inside.length) {
      const dot = document.createElement("span");
      const state = subtreeState(node.path);
      dot.className = "rollup" + (state ? " " + state : "");
      dot.textContent = "●";
      dot.title = inside.length + (inside.length === 1 ? " session" : " sessions") + " inside";
      row.appendChild(dot);
    }
  }

  const add = document.createElement("button");
  add.className = "add-btn";
  add.textContent = "+";
  add.title = "new session on " + node.path;
  add.onclick = () => openSpawn(node.path);
  row.appendChild(add);

  container.appendChild(row);

  const own = collapsed ? [] : sessionsForNode(node.path);
  const showSpawn = spawningNode === node.path;
  const showChildren = hasKids && expanded.has(node.path);
  if (own.length || showSpawn || showChildren) {
    const kids = document.createElement("div");
    kids.className = "node-children";
    for (const s of own) kids.appendChild(sessionRow(s));
    if (showSpawn) kids.appendChild(spawnInputRow(node));
    if (showChildren) for (const child of node.children) renderNode(child, kids);
    container.appendChild(kids);
  }
}

// The vault root is a row in the tree, not app chrome. Its home agent is the
// orchestrator chat session: always present, never deletable (the server
// refuses to kill it), shown with the same ⌂ dot as any other node's home.
let rootCollapsed = false;
function renderRootNode(container) {
  const row = document.createElement("div");
  row.className = "node-row";

  const caret = document.createElement("button");
  caret.className = "caret";
  caret.textContent = rootCollapsed ? "▸" : "▾";
  caret.onclick = () => {
    rootCollapsed = !rootCollapsed;
    renderSidebar();
  };
  row.appendChild(caret);

  const name = document.createElement("button");
  name.className = "node-name";
  name.textContent = "projects";
  name.title = "all projects";
  name.onclick = () => focusNode(null);
  row.appendChild(name);

  const chat = lastSessions.find((s) => s.isChat);
  const dot = document.createElement("button");
  dot.className =
    "home-dot" + (chat?.state ? " " + chat.state : "") + (active === CHAT ? " active" : "");
  dot.textContent = "⌂";
  dot.title = "orchestrator chat" + (chat?.state ? " — " + (STATE_HINT[chat.state] ?? "") : "");
  dot.onclick = () => show(CHAT);
  row.appendChild(dot);

  if (rootCollapsed) {
    const inside = lastSessions.filter((s) => !s.isChat && s.node);
    if (inside.length) {
      let best = null;
      for (const s of inside) {
        if ((STATE_RANK[s.state] ?? 0) > (STATE_RANK[best] ?? 0)) best = s.state;
      }
      const roll = document.createElement("span");
      roll.className = "rollup" + (best ? " " + best : "");
      roll.textContent = "●";
      roll.title = inside.length + (inside.length === 1 ? " session" : " sessions") + " inside";
      row.appendChild(roll);
    }
  }

  container.appendChild(row);

  if (!rootCollapsed) {
    const kids = document.createElement("div");
    kids.className = "node-children";
    for (const node of treeNodes) renderNode(node, kids);
    container.appendChild(kids);
  }
}

function renderCrumbs() {
  crumbsEl.innerHTML = "";
  const line = document.createElement("span");
  line.id = "crumb-line";
  crumbsEl.appendChild(line);
  const crumbsTarget = line;
  const root = document.createElement("button");
  root.className = "crumb" + (focusPath ? "" : " here");
  root.textContent = focusPath ? "⌂" : "projects";
  root.title = "all projects";
  root.onclick = () => focusNode(null);
  crumbsTarget.appendChild(root);
  if (!focusPath) return;
  const parts = focusPath.split("/");
  parts.forEach((part, i) => {
    const sep = document.createElement("span");
    sep.className = "crumb-sep";
    sep.textContent = "/";
    crumbsTarget.appendChild(sep);
    const seg = document.createElement("button");
    const segPath = parts.slice(0, i + 1).join("/");
    seg.className = "crumb" + (segPath === focusPath ? " here" : "");
    seg.textContent = part;
    seg.onclick = () => focusNode(segPath);
    crumbsTarget.appendChild(seg);
  });
}

let sidebarKey = "";
function renderSidebar(force = false) {
  // While the spawn name input has focus, background polls must not rebuild
  // the tree out from under the user's typing. Explicit spawn-flow renders
  // pass force.
  if (
    !force &&
    spawningNode &&
    document.activeElement === treeEl.querySelector(".sess-row.spawn input")
  )
    return;
  // Rebuild only on real state change so buttons stay stable between polls.
  const key = JSON.stringify([
    active,
    filterOn,
    focusPath,
    rootCollapsed,
    spawningNode,
    spawnError,
    [...expanded].sort(),
    lastSessions.map((s) => [s.name, s.node, s.state]),
    treeNodes,
  ]);
  if (key === sidebarKey) return;
  sidebarKey = key;

  // A focused node that disappeared from the vault falls back to the root.
  if (focusPath && !findNode(focusPath)) focusPath = null;
  renderCrumbs();

  treeEl.innerHTML = "";
  if (focusPath) renderNode(findNode(focusPath), treeEl);
  else renderRootNode(treeEl);

  unfiledEl.innerHTML = "";
  const unfiled = lastSessions.filter((s) => !s.isChat && !s.node);
  if (unfiled.length) {
    const title = document.createElement("div");
    title.className = "title";
    title.textContent = "unfiled sessions";
    unfiledEl.appendChild(title);
    for (const s of unfiled) {
      unfiledEl.appendChild(sessionRow(s));
    }
  }
}

// ---- keyboard shortcuts ----
// The shortcut editor (⌘ button) is the primary surface: click a chord, press
// the new keys, saved to localStorage. /keymap.js only supplies factory
// defaults. Every action names a context ("when"), because the same chord
// means different things in different states: cmd+w in a session view
// detaches back to chat, while cmd+w in chat keeps its browser meaning.

async function killSession(name) {
  if (!name || name === CHAT) return;
  if (!confirm(`Kill tmux session "${name}"? Processes inside it will stop.`)) return;
  const res = await fetch(`/api/kill/${encodeURIComponent(name)}`, { method: "POST" });
  if (!res.ok) {
    alert(`kill failed: ${(await res.json()).error ?? res.status}`);
    return;
  }
  // Killing the viewed session: tmux drops our client, the socket closes, and
  // ws.onclose falls back to chat. Killing from the sidebar only needs the
  // list refreshed.
  if (name !== active) refreshSessions();
}

function killActiveSession() {
  if (active !== CHAT) killSession(active);
}

const ACTION_META = [
  { action: "close-session", label: "close session view (detach)", when: "session" },
  { action: "kill-session", label: "kill tmux session", when: "session" },
  { action: "toggle-sidebar", label: "toggle project tree", when: "any" },
  { action: "toggle-filter", label: "toggle sessions filter", when: "any" },
  { action: "command-bar", label: "type a command (voice grammar)", when: "any" },
];

const ACTIONS = {
  "close-session": closeSessionView,
  "kill-session": killActiveSession,
  "toggle-sidebar": () => treeBtn.onclick(),
  "toggle-filter": () => filterBtn.onclick(),
  "command-bar": () => openCmdBar(),
};

const KEYMAP_STORE = "agentshell.keymap";

// The live keymap: one entry per action, keys possibly null (unbound).
// localStorage overrides win over the factory defaults in /keymap.js.
function loadKeymap() {
  let stored = {};
  try { stored = JSON.parse(localStorage.getItem(KEYMAP_STORE)) ?? {}; } catch {}
  return ACTION_META.map((m) => {
    const fallback = (window.KEYMAP ?? []).find((b) => b.action === m.action)?.keys ?? null;
    return { ...m, keys: m.action in stored ? stored[m.action] : fallback };
  });
}
let keymap = loadKeymap();

function saveKeymap() {
  const out = {};
  for (const b of keymap) out[b.action] = b.keys;
  localStorage.setItem(KEYMAP_STORE, JSON.stringify(out));
  lockKeymapKeys();
  renderSettings();
}

function shellContext() {
  return active === CHAT ? "chat" : "session";
}

function parseChord(keys) {
  const parts = keys.toLowerCase().split("+");
  const key = parts.pop();
  return {
    key,
    meta: parts.includes("cmd") || parts.includes("meta"),
    ctrl: parts.includes("ctrl"),
    alt: parts.includes("alt") || parts.includes("option"),
    shift: parts.includes("shift"),
  };
}

function chordMatches(chord, e) {
  return (
    e.key.toLowerCase() === chord.key &&
    e.metaKey === chord.meta &&
    e.ctrlKey === chord.ctrl &&
    e.altKey === chord.alt &&
    e.shiftKey === chord.shift
  );
}

// ---- shortcut editor ----

const keysBtn = document.getElementById("keys-btn");
const settingsEl = document.getElementById("settings");
const settingsRows = document.getElementById("s-rows");
let recordingAction = null;

keysBtn.onclick = () => {
  settingsEl.hidden = !settingsEl.hidden;
  keysBtn.classList.toggle("on", !settingsEl.hidden);
  if (!settingsEl.hidden) closeAgentPanel(); // panels share the same corner
  recordingAction = null;
  renderSettings();
};

document.getElementById("s-reset").onclick = () => {
  localStorage.removeItem(KEYMAP_STORE);
  keymap = loadKeymap();
  lockKeymapKeys();
  renderSettings();
};

// Chords the browser or OS keeps to itself; shown as a warning in the editor.
function chordNote(keys) {
  if (!keys) return "";
  const c = parseChord(keys);
  if (c.meta && c.key === "q") return "never reaches the app";
  if (c.meta && ["w", "t", "n"].includes(c.key)) return "fullscreen only";
  return "";
}

function renderSettings() {
  if (settingsEl.hidden) return;
  settingsRows.innerHTML = "";
  for (const b of keymap) {
    const row = document.createElement("div");
    row.className = "s-row";
    const label = document.createElement("span");
    label.className = "s-label";
    label.textContent = b.label;
    const when = document.createElement("span");
    when.className = "s-when";
    when.textContent = b.when;
    const chord = document.createElement("button");
    const recording = recordingAction === b.action;
    chord.className = "s-chord" + (recording ? " recording" : b.keys ? "" : " unbound");
    chord.textContent = recording ? "press keys…" : b.keys ?? "unbound";
    chord.onclick = () => {
      recordingAction = recording ? null : b.action;
      renderSettings();
    };
    const note = document.createElement("span");
    note.className = "s-note";
    note.textContent = recording ? "" : chordNote(b.keys);
    row.append(label, when, chord, note);
    settingsRows.appendChild(row);
  }
}

// Recorder: while a chord button is armed, the next keydown becomes the
// binding. Registered before the engine listener; stopImmediatePropagation
// keeps the recorded chord from also firing its old or new action.
window.addEventListener(
  "keydown",
  (e) => {
    if (!recordingAction) return;
    e.preventDefault();
    e.stopImmediatePropagation();
    if (e.key === "Escape") {
      recordingAction = null;
      renderSettings();
      return;
    }
    if (["Meta", "Control", "Alt", "Shift"].includes(e.key)) return; // still holding modifiers
    const b = keymap.find((x) => x.action === recordingAction);
    recordingAction = null;
    if (e.key === "Backspace") {
      b.keys = null;
    } else {
      const parts = [];
      if (e.metaKey) parts.push("cmd");
      if (e.ctrlKey) parts.push("ctrl");
      if (e.altKey) parts.push("alt");
      if (e.shiftKey) parts.push("shift");
      parts.push(e.key.toLowerCase());
      b.keys = parts.join("+");
    }
    saveKeymap();
  },
  { capture: true }
);

// Engine: capture phase on window runs before xterm's own key handling, so a
// matched binding never leaks into the terminal. Dormant while the editor is
// open so trying out chords cannot fire actions.
window.addEventListener(
  "keydown",
  (e) => {
    if (!settingsEl.hidden) return;
    if (e.target instanceof HTMLInputElement) return; // typing a spawn name
    const ctx = shellContext();
    for (const b of keymap) {
      if (!b.keys) continue;
      if (b.when !== "any" && b.when !== ctx) continue;
      if (!chordMatches(parseChord(b.keys), e)) continue;
      e.preventDefault();
      e.stopPropagation();
      ACTIONS[b.action]?.();
      return;
    }
  },
  { capture: true }
);

// ---- caffeinate toggle ----
// Server-side `caffeinate -di` tied to the shell's lifetime. The server owns
// the state; the button reflects it via the /api/sessions poll, so a second
// window stays in sync.

const caffeineBtn = document.getElementById("caffeine-btn");
let caffeineOn = false;

function setCaffeineState(on) {
  caffeineOn = Boolean(on);
  caffeineBtn.classList.toggle("on", caffeineOn);
  caffeineBtn.title = caffeineOn
    ? "mac kept awake (caffeinate -di), click to release"
    : "keep mac awake (caffeinate -di)";
}

caffeineBtn.onclick = async () => {
  const res = await fetch("/api/caffeinate", {
    method: "POST",
    headers: { "content-type": "application/json" },
    body: JSON.stringify({ on: !caffeineOn }),
  });
  if (res.ok) setCaffeineState((await res.json()).caffeinate);
};

// ---- orchestrator agent picker ----
// The chat session's command comes from the server (`agent` on /api/sessions),
// so the header always names the agent actually driving chat. Switching POSTs
// /api/agent: the server kills the chat tmux session and our reconnect
// respawns it with the new command. Previously used commands are remembered
// in localStorage as a one-click list.

const AGENT_STORE = "agentshell.agents";
const agentBtn = document.getElementById("agent-btn");
const agentPanel = document.getElementById("agent-panel");
const agentRows = document.getElementById("agent-rows");
const agentInput = document.getElementById("agent-input");
let agentCmd = null;

function loadAgents() {
  try { return JSON.parse(localStorage.getItem(AGENT_STORE)) ?? []; } catch { return []; }
}
function saveAgents(list) {
  localStorage.setItem(AGENT_STORE, JSON.stringify(list.slice(0, 8)));
}

function setAgentCmd(cmd) {
  if (cmd === agentCmd) return;
  agentCmd = cmd;
  agentBtn.textContent = "⌁ " + cmd;
  renderAgents();
}

function closeAgentPanel() {
  agentPanel.hidden = true;
  agentBtn.classList.remove("on");
}

agentBtn.onclick = () => {
  agentPanel.hidden = !agentPanel.hidden;
  agentBtn.classList.toggle("on", !agentPanel.hidden);
  if (!agentPanel.hidden) {
    settingsEl.hidden = true; // panels share the same corner
    keysBtn.classList.remove("on");
    renderAgents();
    agentInput.focus();
  }
};

agentInput.onkeydown = (e) => {
  e.stopPropagation();
  if (e.key === "Escape") closeAgentPanel();
  if (e.key === "Enter" && agentInput.value.trim()) switchAgent(agentInput.value.trim());
};

function renderAgents() {
  if (agentPanel.hidden) return;
  agentRows.innerHTML = "";
  const list = [...new Set([agentCmd, ...loadAgents()])].filter(Boolean);
  for (const cmd of list) {
    const row = document.createElement("div");
    row.className = "agent-row" + (cmd === agentCmd ? " current" : "");
    const pick = document.createElement("button");
    pick.className = "agent-cmd";
    pick.textContent = cmd;
    pick.title = cmd === agentCmd ? "current agent" : "switch chat to " + cmd;
    pick.onclick = () => switchAgent(cmd);
    row.appendChild(pick);
    if (cmd !== agentCmd) {
      const del = document.createElement("button");
      del.className = "agent-del";
      del.textContent = "×";
      del.title = "remove from list";
      del.onclick = () => {
        saveAgents(loadAgents().filter((c) => c !== cmd));
        renderAgents();
      };
      row.appendChild(del);
    }
    agentRows.appendChild(row);
  }
}

async function switchAgent(cmd) {
  if (cmd === agentCmd) {
    closeAgentPanel();
    if (!terms.has(CHAT)) show(CHAT); // retry after the fast-death guard tripped
    return;
  }
  if (!confirm(`Restart chat as "${cmd}"? The running chat agent is killed.`)) return;
  const res = await fetch("/api/agent", {
    method: "POST",
    headers: { "content-type": "application/json" },
    body: JSON.stringify({ cmd }),
  });
  if (!res.ok) {
    alert(`switch failed: ${(await res.json()).error ?? res.status}`);
    return;
  }
  saveAgents([cmd, ...loadAgents().filter((c) => c !== cmd)]);
  agentInput.value = "";
  closeAgentPanel();
  setAgentCmd(cmd);
  chatDeaths = 0;
  // The server killed the chat session; drop the stale terminal and reconnect,
  // which recreates chat running the new command.
  dispose(CHAT);
  show(CHAT);
}

// Chrome only delivers reserved chords (cmd+w, cmd+t) to the page while it is
// fullscreen with the Keyboard Lock API engaged. Lock the keymap's keys; the
// lock sits dormant until the page goes fullscreen.
function lockKeymapKeys() {
  if (!navigator.keyboard?.lock) return;
  const codes = keymap
    .filter((b) => b.keys)
    .map((b) => parseChord(b.keys).key)
    .map((k) =>
      /^[a-z]$/.test(k) ? "Key" + k.toUpperCase() : /^[0-9]$/.test(k) ? "Digit" + k : null
    )
    .filter(Boolean);
  if (codes.length) navigator.keyboard.lock(codes).catch(() => {});
}
lockKeymapKeys();

// Outside fullscreen the browser still owns cmd+w. In a session that would
// silently close the whole app, so ask first; in chat, closing the tab is the
// intended meaning and stays silent.
window.addEventListener("beforeunload", (e) => {
  if (active !== CHAT) e.preventDefault();
});

// ---- voice control ----
// One key, spoken addressing. Hold ⌥ and speak, release to send; tap ⌥ to
// latch a longer recording, tap again to send; tap ⇧ while holding to promote
// the hold to a latch mid-utterance. The recording goes to /api/voice with the
// nodes the sidebar currently shows; the server transcribes it and routes the
// utterance: words for an agent travel verbatim (addressed by session or node
// name, focused session when unaddressed), shell verbs (view, spawn, kill,
// sidebar, caffeinate, agent switch, spoken answers) execute server-side.
// Actions only this page can perform (view, close_view, sidebar) come back in
// the response. The HUD pill narrates: listening -> transcribing -> result.

const micBtn = document.getElementById("mic-btn");
const hudEl = document.getElementById("voice-hud");
const hudTextEl = hudEl.querySelector(".vh-text");
let recorder = null;
let recChunks = [];
let recCancelled = false;
let pttHold = false;   // recording is held ⌥ push-to-talk (release sends)
let pttTimer = null;   // pending hold-to-arm timeout
let altClean = false;  // ⌥ is down with no other key pressed since
let hudTimer = null;

function hud(state, text) {
  clearTimeout(hudTimer);
  hudEl.className = "show " + state;
  hudTextEl.textContent = text;
  if (state === "done" || state === "error") hudTimer = setTimeout(() => (hudEl.className = ""), 6000);
}

// The node paths the sidebar currently renders — the user's mental model,
// shipped with every utterance so names resolve the way the tree spells them.
function visibleNodePaths() {
  const out = [];
  const walk = (nodes) => {
    for (const n of nodes) {
      if (filterOn && !subtreeHasSession(n.path)) continue;
      out.push(n.path);
      if (expanded.has(n.path)) walk(n.children);
    }
  };
  walk(focusPath ? [findNode(focusPath)].filter(Boolean) : rootCollapsed ? [] : treeNodes);
  return out;
}

async function startVoice(hold) {
  if (recorder) return;
  pttHold = hold;
  let stream;
  try {
    // Acquired per utterance, not held open: the OS mic indicator then tells
    // the truth about when the shell is actually listening.
    stream = await navigator.mediaDevices.getUserMedia({ audio: true });
  } catch {
    hud("error", "microphone blocked — allow it for this site in Safari settings");
    return;
  }
  const mime = ["audio/mp4", "audio/webm;codecs=opus", "audio/webm"].find((t) => MediaRecorder.isTypeSupported(t));
  recChunks = [];
  recCancelled = false;
  recorder = new MediaRecorder(stream, mime ? { mimeType: mime } : undefined);
  recorder.ondataavailable = (e) => { if (e.data.size) recChunks.push(e.data); };
  recorder.onstop = () => {
    stream.getTracks().forEach((t) => t.stop());
    const type = recorder.mimeType || mime || "audio/mp4";
    const cancelled = recCancelled;
    recorder = null;
    micBtn.classList.remove("rec");
    if (cancelled) {
      // A cancel explained in the HUD (chord cancel) must survive this stop
      // event; a plain cancel (esc, blur) just clears the pill.
      if (!hudEl.className.includes("error")) hudEl.className = "";
      return;
    }
    const blob = new Blob(recChunks, { type });
    if (blob.size < 1500) {
      hud("error", "heard nothing");
      return;
    }
    sendVoice(blob);
  };
  recorder.start();
  micBtn.classList.add("rec");
  hud(
    "listening",
    hold ? "listening — release ⌥ to send, ⇧ or ↑ locks" : "listening — tap ⌥ or click 🎙 to send, esc cancels"
  );
}

function stopVoice() {
  if (recorder && recorder.state === "recording") recorder.stop();
}

function cancelVoice() {
  if (!recorder) return;
  recCancelled = true;
  stopVoice();
}

function applyRouteResult(out) {
  for (const a of out.clientActions ?? []) {
    if (a.type === "view" && a.session) show(a.session);
    else if (a.type === "close_view") closeSessionView();
    else if (a.type === "sidebar") treeBtn.onclick();
  }
  refreshSessions();
  hud("done", `“${out.transcript}” — ${out.summary?.length ? out.summary.join("; ") : "no action"}`);
}

async function sendVoice(blob) {
  hud("busy", "transcribing…");
  try {
    const res = await fetch("/api/voice?focused=" + encodeURIComponent(active ?? CHAT), {
      method: "POST",
      headers: {
        "content-type": blob.type || "application/octet-stream",
        "x-visible-nodes": visibleNodePaths().join(",").slice(0, 4000),
      },
      body: blob,
    });
    const out = await res.json();
    if (!res.ok) throw new Error(out.error ?? "voice failed " + res.status);
    applyRouteResult(out);
  } catch (err) {
    hud("error", String(err.message ?? err));
  }
}

micBtn.onclick = () => (recorder ? stopVoice() : startVoice(false));

// One key, three gestures. Hold ⌥ 200ms: push-to-talk, release sends. Tap ⌥
// (up before the arm timer fires): latched recording, tap ⌥ again to send.
// Tap ⇧ while holding: promote the hold to a latch mid-utterance, so a talk
// that turns out long needs no restart. A real chord (⌥ plus another key)
// never trips any of it: the second key cancels the arm timer or discards an
// in-flight hold recording, and marks the ⌥ press dirty so its release cannot
// read as a tap — option-arrow word jumps keep working inside the terminal.
window.addEventListener(
  "keydown",
  (e) => {
    if (e.target instanceof HTMLInputElement || !settingsEl.hidden || recordingAction) return;
    if (e.key === "Alt" && !e.metaKey && !e.ctrlKey && !e.repeat) {
      altClean = true;
      if (!recorder && !pttTimer) {
        pttTimer = setTimeout(() => {
          pttTimer = null;
          startVoice(true);
        }, 200);
      }
      return;
    }
    if (e.repeat) return;
    altClean = false;
    if (pttTimer && e.key !== "Shift") {
      clearTimeout(pttTimer);
      pttTimer = null;
    }
    if (recorder && pttHold && e.key !== "Alt") {
      // ⇧ or ↑ (the "slide up to lock" reflex) locks the hold into a latch.
      // Any other key means a real ⌥ chord: cancel, and say so — a silent
      // vanish reads as a bug.
      if (e.key === "Shift" || e.key === "ArrowUp") {
        e.preventDefault();
        e.stopPropagation();
        pttHold = false;
        hud("listening", "locked on — tap ⌥ or click 🎙 to send, esc cancels");
      } else {
        cancelVoice();
        hud("error", "cancelled (⌥ chord) — ⇧ or ↑ locks the recording");
      }
      return;
    }
    if (recorder && !pttHold && e.key === "Escape") {
      e.preventDefault();
      e.stopPropagation();
      cancelVoice();
    }
  },
  { capture: true }
);
window.addEventListener(
  "keyup",
  (e) => {
    if (e.key !== "Alt") return;
    const wasTap = Boolean(pttTimer);
    if (pttTimer) {
      clearTimeout(pttTimer);
      pttTimer = null;
    }
    if (recorder && pttHold) stopVoice(); // hold release: send
    else if (wasTap && !recorder) startVoice(false); // tap: start latched
    else if (recorder && !pttHold && altClean) stopVoice(); // tap during latch: send
    altClean = false;
  },
  { capture: true }
);
// A lost window (cmd+tab away) can never leave the mic hot.
window.addEventListener("blur", cancelVoice);

// ---- typed command lane ----
// The same grammar as voice, over a keyboard (default cmd+k): type what you
// would have said ("megabranch, run the client build", "show me PG&E") and it
// routes identically through /api/command. For when speaking is not an option.

const cmdBar = document.getElementById("cmd-bar");
const cmdInput = document.getElementById("cmd-input");

function openCmdBar() {
  cmdBar.hidden = false;
  cmdInput.value = "";
  cmdInput.focus();
}

cmdInput.onkeydown = (e) => {
  e.stopPropagation();
  if (e.key === "Escape") closeCmdBar();
  if (e.key === "Enter" && cmdInput.value.trim()) {
    const text = cmdInput.value.trim();
    closeCmdBar();
    sendCommand(text);
  }
};
cmdInput.onblur = () => closeCmdBar();

function closeCmdBar() {
  cmdBar.hidden = true;
  const e = active && terms.get(active);
  if (e) e.term.focus();
}

async function sendCommand(text) {
  hud("busy", "routing…");
  try {
    const res = await fetch("/api/command", {
      method: "POST",
      headers: { "content-type": "application/json" },
      body: JSON.stringify({ text, focused: active ?? CHAT, visibleNodes: visibleNodePaths() }),
    });
    const out = await res.json();
    if (!res.ok) throw new Error(out.error ?? "command failed " + res.status);
    applyRouteResult(out);
  } catch (err) {
    hud("error", String(err.message ?? err));
  }
}

window.addEventListener("resize", refitActive);

show(CHAT);
refreshTree();
refreshSessions();
setInterval(refreshSessions, 2000);
setInterval(refreshTree, 10000);
</script>
