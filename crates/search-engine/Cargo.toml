[package]
name = "tangent-search-engine"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "tangent-search-engine"
path = "src/main.rs"

[dependencies]
anyhow = "1.0"
regex = "1.11"
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
walkdir = "2.5"
