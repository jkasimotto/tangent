<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Area big picture: show me Neara</title>
<style>
  :root { --bg:#0f1115; --panel:#161a21; --fg:#e6e6e6; --dim:#8a919c; --dimmer:#5a6069; --line:#262b34; --cursor:#1f2a3a;
    --needs:#ff6b6b; --waiting:#f5c542; --stuck:#ff9f43; --moving:#4cd964; --quiet:#6f7c8a; --none:#5a6069; --accent:#7cc4ff; }
  * { box-sizing:border-box }
  body { margin:0; background:var(--bg); color:var(--fg); font:14px/1.45 ui-monospace, "SF Mono", Menlo, monospace; }
  header { display:flex; gap:12px; align-items:baseline; padding:14px 20px 8px; border-bottom:1px solid var(--line) }
  header .trail a { color:var(--dim); cursor:pointer } header .trail a:hover { color:var(--fg) }
  header .trail b { font-size:20px; font-weight:600 } header .meta { color:var(--dim); margin-left:auto; font-size:12px }
  header .stale { color:var(--waiting) } header .stopped { color:var(--stuck) }
  main { padding:8px 20px 60px; max-width:1180px }
  .rows { display:flex; flex-direction:column }
  .row { display:grid; grid-template-columns:150px 300px 1fr 120px; gap:12px; padding:6px 10px; border-radius:4px; align-items:baseline; cursor:pointer }
  .row:hover { background:#141821 } .row.cursor { background:var(--cursor); outline:1px solid #33465e }
  .row .name { font-weight:600 } .row .next { color:var(--fg) } .row .who { color:var(--dim); text-align:right }
  .row.child .name::before { content:"▸ "; color:var(--dimmer) }
  .row.fallback .name, .row.fallback .next { color:var(--dim) }
  .row.dim { opacity:.6 }
  .sig { font-weight:600 } .sig::before { content:"● "; }
  .sig[data-s="needs you"] { color:var(--needs) } .sig[data-s="waiting on"] { color:var(--waiting) } .sig[data-s="stuck"] { color:var(--stuck) }
  .sig[data-s="moving"] { color:var(--moving) } .sig[data-s="quiet"] { color:var(--quiet) } .sig[data-s="no brain"] { color:var(--none) } .sig[data-s="no brain"]::before { content:"○ " }
  .mark { color:var(--waiting); font-size:12px; margin-left:8px } .by { color:var(--waiting) } .parent-says { color:var(--dimmer); font-size:12px }
  .pending { color:var(--accent); font-size:12px; margin-left:8px }
  .section { color:var(--dimmer); font-size:11px; text-transform:uppercase; letter-spacing:.08em; padding:14px 10px 4px }
  .expanded { grid-column:2 / -1; padding:4px 0 8px; color:var(--dim); font-size:13px; display:grid; gap:3px }
  .expanded .k { color:var(--dimmer); display:inline-block; width:80px }
  .expanded a { color:var(--accent); cursor:pointer } .expanded .rel { color:var(--fg) }
  .option .name { color:var(--accent) } .option .name::before { content:"▶ " }
  .tangent { margin-top:22px; padding:10px 12px; border-top:1px solid var(--line); color:var(--dim); font-size:13px; display:flex; gap:18px; flex-wrap:wrap }
  .tangent b { color:var(--dimmer); font-weight:500; text-transform:uppercase; font-size:11px; letter-spacing:.08em; margin-right:6px }
  .tangent .hot { color:var(--needs) }
  footer { position:fixed; bottom:0; left:0; right:0; background:var(--panel); border-top:1px solid var(--line); padding:8px 20px; display:flex; gap:6px; flex-wrap:wrap; font-size:12px; color:var(--dim) }
  footer button, .layer button { background:#1d2330; color:var(--fg); border:1px solid #2c3441; border-radius:4px; padding:3px 8px; font:inherit; cursor:pointer }
  footer button:hover, .layer button:hover { border-color:var(--accent) } kbd { color:var(--accent); font:inherit; margin-right:4px }
  .layer { position:fixed; inset:0; background:rgba(0,0,0,.55); display:flex; align-items:flex-start; justify-content:center; padding-top:12vh }
  .layer .box { background:var(--panel); border:1px solid #2c3441; border-radius:6px; min-width:560px; max-width:760px; padding:14px 16px }
  .layer h3 { margin:0 0 10px; font-size:13px; color:var(--dim); font-weight:500 }
  .layer .choice { padding:6px 8px; border-radius:4px; cursor:pointer } .layer .choice.cursor { background:var(--cursor) } .layer .choice:hover { background:#141821 }
  .layer textarea { width:100%; min-height:70px; background:#0f1115; color:var(--fg); border:1px solid #2c3441; border-radius:4px; font:inherit; padding:8px }
  .layer .foot { display:flex; gap:8px; margin-top:10px; align-items:center; color:var(--dimmer); font-size:12px }
  .help td { padding:2px 12px 2px 0 } .help td:first-child { color:var(--accent) }
  .log { position:fixed; right:16px; bottom:56px; width:340px; max-height:60vh; overflow:auto; background:var(--panel); border:1px solid var(--line); border-radius:6px; padding:8px 10px; font-size:12px; color:var(--dim) }
  .log h4 { margin:0 0 6px; font-size:11px; color:var(--dimmer); text-transform:uppercase; letter-spacing:.08em } .log div { padding:2px 0; border-bottom:1px solid var(--line) }
  .log div:last-child { color:var(--fg) }
  svg text { font:12px ui-monospace, Menlo, monospace; fill:var(--fg) } svg .area { fill:var(--dimmer); font-size:11px; text-transform:uppercase }
  svg .edge { stroke:var(--dim); fill:none; stroke-width:1.2 } svg .edge-label { fill:var(--dim); font-size:11px } svg .node { fill:var(--panel); stroke:#2c3441 }
  svg .node.needs { stroke:var(--needs) } svg .node.waiting { stroke:var(--waiting) } svg .node.stuck { stroke:var(--stuck) } svg .node.moving { stroke:var(--moving) }
  .empty { color:var(--dim); padding:20px 10px }
  @media (max-width: 900px) { .row { grid-template-columns:95px 1fr; } .row .who { text-align:left } .layer .box { min-width:0; width:92vw } .log { display:none } }
</style>
</head>
<body>
<header id="header"></header>
<main id="main"></main>
<aside class="log" id="log"><h4>What the picture sent or opened</h4><div>nothing yet</div></aside>
<footer id="footer"></footer>
<div id="layer"></div>
<script type="module">
import { AREAS, PANELS, KEY_SHEET, actionsFor, back, childRows, cursorRow, drill, goTo, handleKey, initialState, pictureRows, relationGraph, runAction, sendComposer, tangentSees, top, verbsFor } from "./big-picture.mjs";

let state = initialState("neara");
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? "").replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));

/** Apply a state change and redraw. */
function update(next) { state = next; render(); }

/** Header: breadcrumb, presenter, staleness, brain state. */
function renderHeader() {
  const { areaId } = top(state);
  const area = AREAS[areaId]; const panel = PANELS[areaId];
  const crumbs = [];
  for (let id = areaId; id; id = AREAS[id].parent) crumbs.unshift(id);
  const trailHtml = crumbs.map((id, i) => i === crumbs.length - 1 ? `<b>${esc(AREAS[id].name)}</b>` : `<a data-go="${id}">${esc(AREAS[id].name)}</a> <span style="color:var(--dimmer)">/</span>`).join(" ");
  let meta;
  if (!panel) meta = `no brain · note ${area.noteLines} lines · ${area.open} open`;
  else meta = `presented by ${esc(panel.presentedBy)} · ${esc(panel.at)}` + (panel.changesSince ? ` · <span class="stale">older than the notes · ${panel.changesSince} changes since</span>` : "") + (panel.brainStopped ? ` · <span class="stopped">brain stopped</span> <button data-resume>Resume brain</button>` : "");
  $("header").innerHTML = `<span class="trail">${trailHtml}</span><span class="meta">${meta}</span>`;
  $("header").querySelectorAll("[data-go]").forEach((a) => a.onclick = () => update(goTo(state, a.dataset.go)));
  $("header").querySelector("[data-resume]")?.addEventListener("click", () => update({ ...state, log: [...state.log, `tangent brain start ${areaId}`] }));
}

/** One outcome row, plus its expanded block. */
function outcomeRow(row, i, picture) {
  const o = row.outcome; const cur = i === picture.cursor ? "cursor" : "";
  const dim = PANELS[row.areaId]?.brainStopped ? "dim" : "";
  const mark = o.source === "brain" ? `<span class="mark">not in a note yet</span>` : "";
  const by = o.by ? ` <span class="by">· by ${o.by.date.slice(5)} “${esc(o.by.words)}”</span>` : "";
  const pending = state.pending[row.id] ? `<span class="pending">${esc(state.pending[row.id])}</span>` : "";
  const exp = picture.expanded.has(row.id) ? `<div class="expanded">
      <div><span class="k">evidence</span>${o.evidence.map((e) => `<a data-open="${esc(e.label)}">${esc(e.label)}</a>`).join(" · ")}</div>
      ${o.relations.length ? `<div><span class="k">relation</span>${o.relations.map((r) => `<span class="rel">${r.kind} <a data-go="${r.area}">${esc(r.target)}</a> <span style="color:var(--dimmer)">(${esc(AREAS[r.area].name)})</span></span>`).join(" · ")}</div>` : ""}
      ${o.unsure ? `<div><span class="k">unsure</span>${esc(o.unsure)}</div>` : ""}
      <div><span class="k">from</span>${o.source === "brain" ? "the brain’s own words, not in a note yet" : `<a data-open="${esc(o.source)}">${esc(o.source)}</a>`}</div>
    </div>` : "";
  return `<div class="row outcome ${cur} ${dim}" data-i="${i}" title="from ${esc(o.source)}" aria-label="${esc(o.signal)}: ${esc(o.outcome)}, next ${esc(o.next)}, ${esc(o.who)}">
    <span class="sig" data-s="${o.signal}">${o.signal}${o.signal === "waiting on" ? " " + esc(o.who) : ""}</span>
    <span class="name">${esc(o.outcome)}${mark}${pending}</span><span class="next">${esc(o.next)}${by}</span><span class="who">${esc(o.who)}</span>${exp}</div>`;
}

/** One option row. */
function optionRow(row, i, picture) {
  const cur = i === picture.cursor ? "cursor" : "";
  const pending = state.pending[row.id] ? `<span class="pending">${esc(state.pending[row.id])}</span>` : "";
  return `<div class="row option ${cur}" data-i="${i}"><span></span><span class="name" style="grid-column:2 / -1">${esc(row.option.text)}${pending}</span></div>`;
}

/** One child row: name, signal, next move, who. */
function childRow(row, i, picture) {
  const c = row.child; const cur = i === picture.cursor ? "cursor" : "";
  const pending = state.pending[row.id] ? `<span class="pending">${esc(state.pending[row.id])}</span>` : "";
  const by = c.by ? ` <span class="by">· by ${c.by.date.slice(5)}</span>` : "";
  const mark = c.source === "brain" ? `<span class="mark">not in a note yet</span>` : "";
  const ps = c.parentSays ? ` <span class="parent-says">parent says: ${esc(c.parentSays.signal)} ${esc(c.parentSays.who)}</span>` : "";
  const stopped = c.brainStopped ? ` <span class="parent-says">brain stopped</span>` : "";
  return `<div class="row child ${cur} ${c.fallback ? "fallback" : ""}" data-i="${i}" aria-label="${esc(c.signal)}: ${esc(c.name)}, next ${esc(c.next)}">
    <span class="sig" data-s="${c.signal}">${c.signal}${c.signal === "waiting on" ? " " + esc(c.who) : ""}</span>
    <span class="name">${esc(c.name)}${pending}</span><span class="next">${esc(c.next)}${by}${mark}${ps}${stopped}</span><span class="who">${esc(c.who ?? "")}</span></div>`;
}

/** The stacked list: outcomes, options, child rows, then the Tangent block. */
function renderList() {
  const picture = top(state); const rows = pictureRows(picture.areaId);
  const panel = PANELS[picture.areaId]; const area = AREAS[picture.areaId];
  let html = "";
  if (!panel) html += `<div class="empty">no brain · no picture. The rows below are Tangent facts only. <button data-key="s" style="margin-left:8px">Start brain</button></div>`;
  let lastKind = null;
  rows.forEach((row, i) => {
    if (row.kind !== lastKind) { html += `<div class="section">${row.kind === "outcome" ? "outcomes, the brain’s order" : row.kind === "option" ? "options, one press approves" : "areas inside, sorted by signal"}</div>`; lastKind = row.kind; }
    html += row.kind === "outcome" ? outcomeRow(row, i, picture) : row.kind === "option" ? optionRow(row, i, picture) : childRow(row, i, picture);
  });
  if (!rows.length) html += `<div class="empty">nothing here</div>`;
  const t = tangentSees(picture.areaId);
  html += `<div class="tangent"><b>Tangent sees</b><span class="${t.agents ? "" : ""}">${t.agents} agent${t.agents === 1 ? "" : "s"} working</span><span class="${t.checkIt ? "hot" : ""}">${t.checkIt} Check it</span><span class="${t.requests ? "hot" : ""}">${t.requests} request${t.requests === 1 ? "" : "s"}</span><span>note ${area.noteAge}</span><span>${t.brainsLive} brain${t.brainsLive === 1 ? "" : "s"} live of ${t.brainsTotal}</span></div>`;
  $("main").innerHTML = html;
  $("main").querySelectorAll(".row").forEach((el) => {
    el.onclick = (e) => { if (e.target.closest("a")) return; const i = Number(el.dataset.i); const picture = top(state); if (i === picture.cursor) update(handleKey(state, "Enter")); else update({ ...state, stack: [...state.stack.slice(0, -1), { ...picture, cursor: i }] }); };
  });
  $("main").querySelectorAll("[data-go]").forEach((a) => a.onclick = () => update(drill(state, a.dataset.go)));
  $("main").querySelectorAll("[data-open]").forEach((a) => a.onclick = () => update({ ...state, log: [...state.log, `open ${a.dataset.open}`] }));
  $("main").querySelector("[data-key=s]")?.addEventListener("click", () => update({ ...state, log: [...state.log, `tangent brain start ${picture.areaId}`] }));
}

/** Relations view: one column per Area, nodes for outcomes, edges for declared relations. */
function renderRelations() {
  const { nodes, edges } = relationGraph(top(state).areaId);
  const areas = [...new Set(nodes.map((n) => n.areaId))];
  const colW = 320, rowH = 74, pad = 20;
  const pos = {}; const perArea = {};
  nodes.forEach((n) => { const col = areas.indexOf(n.areaId); const r = perArea[n.areaId] = (perArea[n.areaId] ?? 0) + 1; pos[n.id] = { x: pad + col * colW, y: 40 + (r - 1) * rowH }; });
  const width = pad * 2 + areas.length * colW, height = 60 + Math.max(...Object.values(perArea)) * rowH;
  const cls = (s) => ({ "needs you": "needs", "waiting on": "waiting", "stuck": "stuck", "moving": "moving" }[s] ?? "");
  let svg = `<svg width="${width}" height="${height}" viewBox="0 0 ${width} ${height}">`;
  areas.forEach((a, i) => svg += `<text class="area" x="${pad + i * colW}" y="22">${esc(AREAS[a].name)}</text>`);
  for (const e of edges) {
    if (!e.to) continue;
    const a = pos[e.from], b = pos[e.to];
    const x1 = a.x + 200, y1 = a.y + 20, x2 = b.x, y2 = b.y + 20;
    const forward = x2 > x1;
    const sx = forward ? x1 : a.x, ex = forward ? x2 : b.x + 200;
    svg += `<path class="edge" d="M${sx},${y1} C${sx + (forward ? 40 : -40)},${y1} ${ex + (forward ? -40 : 40)},${y2} ${ex},${y2}" marker-end="url(#arrow)"/><text class="edge-label" x="${(sx + ex) / 2 - 20}" y="${(y1 + y2) / 2 - 4}">${esc(e.kind)}</text>`;
  }
  svg += `<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#8a919c"/></marker></defs>`;
  for (const n of nodes) { const p = pos[n.id]; svg += `<g data-go="${n.areaId}" style="cursor:pointer"><rect class="node ${cls(n.signal)}" x="${p.x}" y="${p.y}" width="200" height="40" rx="5"/><text x="${p.x + 8}" y="${p.y + 17}">${esc(n.outcome.length > 28 ? n.outcome.slice(0, 27) + "…" : n.outcome)}</text><text x="${p.x + 8}" y="${p.y + 32}" class="edge-label">${esc(n.signal)}</text></g>`; }
  svg += `</svg>`;
  $("main").innerHTML = `<div class="section">relations across ${esc(AREAS[top(state).areaId].name)} and inside, from declared needs / feeds / same as / shares. <kbd>g</kbd> or <kbd>Esc</kbd> back</div><div style="overflow:auto">${svg}</div>`;
  $("main").querySelectorAll("[data-go]").forEach((g) => g.onclick = () => update(drill({ ...state, view: "list" }, g.dataset.go)));
}

/** Footer: every verb for the cursor row, each a button with its key printed. */
function renderFooter() {
  const row = cursorRow(state);
  const verbs = state.view === "relations" ? [["g", "Back to list"]] : verbsFor(row);
  $("footer").innerHTML = verbs.map(([k, label]) => `<button data-key="${esc(k)}"><kbd>${esc(k)}</kbd>${esc(label)}</button>`).join("") + `<button data-key="Escape"><kbd>Esc</kbd>${state.stack.length > 1 ? "Back to " + esc(AREAS[state.stack.at(-2).areaId].name) : "Back to Work"}</button><button data-key="?"><kbd>?</kbd>Keys</button>`;
  $("footer").querySelectorAll("button").forEach((b) => b.onclick = () => update(handleKey(state, b.dataset.key)));
}

/** Layers: actions menu, composer, key sheet. */
function renderLayer() {
  const l = state.layer;
  if (!l) { $("layer").innerHTML = ""; return; }
  let box = "";
  if (l.kind === "actions") {
    const actions = actionsFor(l.row);
    box = `<h3>Actions on “${esc(l.row.kind === "child" ? l.row.child.name : l.row.kind === "option" ? l.row.option.text : l.row.outcome.outcome)}”</h3>` + actions.map(([id, label], i) => `<div class="choice ${i === l.choice ? "cursor" : ""}" data-action="${id}">${esc(label)}</div>`).join("") + `<div class="foot"><kbd>Enter</kbd> run · <kbd>Esc</kbd> close</div>`;
  } else if (l.kind === "compose") {
    box = `<h3>${l.mode === "correct" ? "Correction" : "Ask"} to the responsible brain. The brain changes the note, then presents again. The picture never edits itself.</h3><textarea id="composer">${esc(l.text)}</textarea><div class="foot"><button data-send>Send</button><span><kbd>Enter</kbd> send · <kbd>Esc</kbd> cancel</span></div>`;
  } else {
    box = `<h3>Keys</h3><table class="help">${KEY_SHEET.map(([k, d]) => `<tr><td>${esc(k)}</td><td>${esc(d)}</td></tr>`).join("")}</table><div class="foot"><kbd>Esc</kbd> close</div>`;
  }
  $("layer").innerHTML = `<div class="layer"><div class="box">${box}</div></div>`;
  $("layer").querySelector(".layer").onclick = (e) => { if (e.target.classList.contains("layer")) update(back(state)); };
  $("layer").querySelectorAll("[data-action]").forEach((c) => c.onclick = () => update(runAction(state, c.dataset.action)));
  const ta = $("composer");
  if (ta) { ta.focus(); ta.setSelectionRange(ta.value.length, ta.value.length); ta.oninput = () => { state.layer.text = ta.value; }; ta.onkeydown = (e) => { if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); update(sendComposer(state)); } if (e.key === "Escape") update(back(state)); e.stopPropagation(); }; }
  $("layer").querySelector("[data-send]")?.addEventListener("click", () => update(sendComposer(state)));
}

/** Redraw everything from state. */
function render() {
  renderHeader();
  state.view === "relations" ? renderRelations() : renderList();
  renderFooter(); renderLayer();
  $("log").innerHTML = `<h4>What the picture sent or opened</h4>` + (state.log.length ? state.log.slice(-8).map((l) => `<div>${esc(l)}</div>`).join("") : "<div>nothing yet</div>");
}

document.addEventListener("keydown", (e) => {
  if (e.target.tagName === "TEXTAREA") return;
  if ((e.metaKey || e.ctrlKey) && e.key === "k") { e.preventDefault(); const q = prompt("Go to Area: " + Object.values(AREAS).map((a) => a.name).join(", ")); const hit = Object.keys(AREAS).find((id) => AREAS[id].name.toLowerCase() === (q ?? "").trim().toLowerCase()); if (hit) update(goTo(state, hit)); return; }
  if (["j", "k", "ArrowDown", "ArrowUp", "Enter", "Escape", "a", "c", ":", "b", "g", "o", "s", "?"].includes(e.key)) { e.preventDefault(); update(handleKey(state, e.key)); }
});
render();
</script>
</body>
</html>
