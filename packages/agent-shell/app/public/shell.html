<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="color-scheme" content="dark" />
  <title>Agent Shell</title>
  <link rel="icon" href="/icon.png" />
  <link rel="apple-touch-icon" href="/icon.png" />
  <link rel="stylesheet" href="/vendor/xterm/xterm.css" />
  <link rel="stylesheet" href="/shell.css" />
</head>
<body>
  <div id="app">
    <header class="app-bar">
      <button id="back-button" class="bar-button back-button" type="button" aria-haspopup="menu" aria-controls="shell-menu" aria-expanded="false">Agent Shell</button>
      <nav class="primary-tabs" aria-label="Agent Shell sections">
        <button id="map-tab" class="primary-tab" type="button">Map</button>
        <button id="work-tab" class="primary-tab" type="button">Work</button>
        <button id="areas-tab" class="primary-tab" type="button" hidden>Areas</button>
      </nav>
      <div id="bar-context" class="bar-context" aria-live="polite"></div>
      <div class="bar-actions">
        <div id="cost-readout" class="cost-readout" hidden>
          <span id="cost-amount" class="cost-amount" tabindex="0" role="status"></span>
          <div id="cost-breakdown" class="cost-breakdown"></div>
        </div>
        <span id="status-pill" class="status-pill" role="status" hidden></span>
        <button id="awake-button" class="bar-button awake-button" type="button" aria-label="Keep Mac awake" title="Keep Mac awake">☕︎</button>
        <button id="secondary-action" class="bar-button danger-bar-button" type="button" hidden>Stop agent…</button>
        <button id="for-you-button" class="bar-button quiet-bar-button" type="button">For you</button>
        <button id="problems-button" class="bar-button quiet-bar-button" type="button">Problems</button>
        <button id="context-brain-button" class="bar-button context-brain-button" type="button" hidden>Area Brain</button>
        <button id="go-to-button" class="bar-button find-button" type="button">Go to</button>
        <button id="find-button" class="bar-button find-button" type="button">Find work</button>
      </div>
    </header>

    <div id="shell-menu" class="shell-menu" role="menu" aria-label="Agent Shell" hidden>
      <button id="menu-update" class="shell-menu-item update" type="button" role="menuitem" hidden>Update available</button>
      <button id="prompts-tab" class="shell-menu-item" type="button" role="menuitem">Model</button>
      <button id="menu-refresh" class="shell-menu-item" type="button" role="menuitem">Refresh data</button>
      <button id="menu-reload" class="shell-menu-item" type="button" role="menuitem">Reload app</button>
      <button id="menu-rebuild" class="shell-menu-item" type="button" role="menuitem">Rebuild and restart…</button>
      <button id="menu-awake" class="shell-menu-item" type="button" role="menuitem">Keep Mac awake</button>
    </div>

    <aside id="update-panel" class="update-panel" role="status" aria-live="polite" hidden>
      <p id="update-panel-kicker" class="kicker">Tangent update</p>
      <strong id="update-panel-title"></strong>
      <p id="update-panel-copy"></p>
      <ul id="update-panel-commits" class="update-commits" hidden></ul>
      <div id="update-panel-actions" class="update-panel-actions"></div>
    </aside>

    <main id="screen" class="screen" aria-live="polite"></main>

    <div id="work-lens-layer" class="work-lens-layer" hidden>
      <section class="work-lens-surface" role="region" aria-labelledby="work-lens-title">
        <header class="work-lens-header">
          <h2 id="work-lens-title">Work</h2>
          <p id="work-lens-freshness" class="work-lens-freshness" role="status" aria-live="polite"></p>
          <button class="bar-button work-lens-close-button" type="button" data-close-work-lens>Close Work</button>
        </header>
        <div id="work-lens-content" class="work-lens-content"></div>
      </section>
    </div>

    <div id="session-layer" class="session-layer" hidden>
      <section class="session-surface" role="dialog" aria-modal="true" aria-label="Agent session">
        <header class="session-layer-header"><button type="button" data-close-session-layer aria-label="Back to Work"><span data-session-return-label>Back to Work</span> <kbd>⌘⇧↵</kbd></button><div id="session-layer-title" class="session-layer-title"></div><button type="button" data-session-go-to>Go to <kbd>⌘K</kbd></button></header>
        <div id="session-layer-terminal" class="terminal-host session-layer-terminal"></div>
      </section>
    </div>

    <div id="document-peek-layer" class="document-peek-layer" hidden></div>

    <div id="modal-layer" class="modal-layer" hidden>
      <section class="modal" role="dialog" aria-modal="true" aria-labelledby="modal-title">
        <p id="modal-kicker" class="kicker"></p>
        <h2 id="modal-title"></h2>
        <div id="modal-copy" class="modal-copy"></div>
        <div id="modal-field" class="modal-field" hidden></div>
        <div id="modal-actions" class="modal-actions"></div>
      </section>
    </div>

    <div id="go-to-layer" class="go-to-layer" hidden>
      <section class="go-to" role="dialog" aria-modal="true" aria-labelledby="go-to-title">
        <p id="go-to-title" class="kicker">Go to</p>
        <input id="go-to-input" type="text" role="combobox" aria-labelledby="go-to-title" aria-expanded="true" aria-controls="go-to-list" aria-autocomplete="list" autocomplete="off" spellcheck="false" placeholder="Type a name" />
        <div class="go-to-filters">
          <label><span>Area</span><select id="go-to-area"><option value="">All Areas</option></select></label>
          <label><span>Kind</span><select id="go-to-kind"><option value="">All kinds</option></select></label>
          <button id="go-to-view" type="button" aria-pressed="false">Graph</button>
        </div>
        <p class="go-to-hint">↑↓ choose · ↵ open · esc close</p>
        <ul id="go-to-list" role="listbox" aria-label="Areas, Goals, Documents, Brains, and agents"></ul>
      </section>
    </div>

    <!-- The Work search line. It lives outside #screen so a repaint never
         replaces the input while Julian types (design agent-shell-work-search). -->
    <form id="work-search" class="work-search" hidden autocomplete="off">
      <span class="work-search-slash" aria-hidden="true">/</span>
      <input id="work-search-input" type="text" aria-label="Search Work" autocomplete="off" spellcheck="false">
      <span id="work-search-count" class="work-search-count"></span>
      <span class="work-search-keys" id="work-search-keys"></span>
    </form>
    <div id="toast" class="toast" role="status" aria-live="polite"></div>
    <!-- Outlives every repaint, so a filter result announces. A live region
         created by the same paint that fills it announces nothing. -->
    <p id="filter-count" class="visually-hidden" role="status" aria-live="polite"></p>
  </div>

  <script src="/vendor/xterm/xterm.js"></script>
  <script src="/vendor/xterm/addon-fit.js"></script>
  <script src="/vendor/xterm/addon-webgl.js"></script>
  <script src="/vendor/d3/d3-dispatch.min.js"></script>
  <script src="/vendor/d3/d3-quadtree.min.js"></script>
  <script src="/vendor/d3/d3-timer.min.js"></script>
  <script src="/vendor/d3/d3-force.min.js"></script>
  <script src="/config.js"></script>
  <script type="module" src="/shell.js"></script>
</body>
</html>
