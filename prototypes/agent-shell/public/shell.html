<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="color-scheme" content="dark" />
  <title>Agent Shell</title>
  <link rel="icon" href="/icon.png" />
  <link rel="apple-touch-icon" href="/icon.png" />
  <link rel="stylesheet" href="/vendor/xterm/xterm.css" />
  <link rel="stylesheet" href="/shell.css" />
</head>
<body>
  <div id="app">
    <header class="app-bar">
      <button id="back-button" class="bar-button back-button" type="button" aria-haspopup="menu">Agent Shell</button>
      <nav class="primary-tabs" aria-label="Agent Shell sections">
        <button id="work-tab" class="primary-tab" type="button">Work</button>
        <button id="areas-tab" class="primary-tab" type="button">Areas</button>
      </nav>
      <div id="bar-context" class="bar-context" aria-live="polite"></div>
      <div class="bar-actions">
        <span id="status-pill" class="status-pill" role="status" hidden></span>
        <button id="secondary-action" class="bar-button danger-bar-button" type="button" hidden>Stop agent…</button>
        <button id="find-button" class="bar-button find-button" type="button">Find work <kbd>⌘/</kbd></button>
      </div>
    </header>

    <div id="shell-menu" class="shell-menu" role="menu" aria-label="Agent Shell" hidden>
      <button id="menu-update" class="shell-menu-item update" type="button" role="menuitem" hidden>Changes · Reload Tangent</button>
      <button id="menu-refresh" class="shell-menu-item" type="button" role="menuitem">Refresh data</button>
      <button id="menu-reload" class="shell-menu-item" type="button" role="menuitem">Reload app</button>
      <button id="menu-rebuild" class="shell-menu-item" type="button" role="menuitem">Rebuild and restart…</button>
      <button id="menu-awake" class="shell-menu-item" type="button" role="menuitem">Keep Mac awake</button>
    </div>

    <main id="screen" class="screen" aria-live="polite"></main>

    <div id="modal-layer" class="modal-layer" hidden>
      <section class="modal" role="dialog" aria-modal="true" aria-labelledby="modal-title">
        <p id="modal-kicker" class="kicker"></p>
        <h2 id="modal-title"></h2>
        <p id="modal-copy" class="modal-copy"></p>
        <div id="modal-field" class="modal-field" hidden></div>
        <div id="modal-actions" class="modal-actions"></div>
      </section>
    </div>

    <div id="toast" class="toast" role="status" aria-live="polite"></div>
  </div>

  <script src="/vendor/xterm/xterm.js"></script>
  <script src="/vendor/xterm/addon-fit.js"></script>
  <script src="/vendor/xterm/addon-webgl.js"></script>
  <script src="/terminal-selection.js"></script>
  <script src="/document-comments.js"></script>
  <script src="/config.js"></script>
  <script src="/shell.js"></script>
</body>
</html>
