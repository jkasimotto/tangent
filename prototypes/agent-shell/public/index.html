<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Agent Shell</title>
<link rel="apple-touch-icon" href="/icon.png" />
<link rel="stylesheet" href="/vendor/xterm/xterm.css" />
<style>
  :root {
    --bg: #0d1117;
    --panel: #161b22;
    --border: #30363d;
    --text: #e6edf3;
    --dim: #8b949e;
    --accent: #3fb950;
    --accent2: #58a6ff;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; background: var(--bg); color: var(--text); font: 13px/1.4 -apple-system, "SF Mono", Menlo, monospace; }
  #app { display: flex; flex-direction: column; height: 100%; position: relative; }
  header {
    display: flex; align-items: center; gap: 10px;
    padding: 8px 14px; background: var(--panel); border-bottom: 1px solid var(--border);
    flex: none;
  }
  header .brand { font-weight: 700; letter-spacing: 0.4px; }
  header .brand .dot { color: var(--accent); }
  #active-label { color: var(--dim); margin-left: 8px; }
  button { font: inherit; cursor: pointer; }
  .hbtn {
    padding: 4px 10px; border-radius: 6px; border: 1px solid var(--border);
    background: transparent; color: var(--dim);
  }
  .hbtn:hover { color: var(--text); border-color: var(--dim); }
  .hbtn.on { color: var(--accent); border-color: var(--accent); }
  .hbtn.danger:hover { color: #f85149; border-color: #f85149; }
  .hbtn[hidden] { display: none; }
  #agent-btn { margin-left: auto; }
  #main { flex: 1; display: flex; min-height: 0; }
  #sidebar {
    width: 0; flex: none; overflow: hidden;
    background: var(--panel); border-right: 1px solid transparent;
    display: flex; flex-direction: column; position: relative;
    transition: width 0.15s ease;
  }
  #sidebar.open { width: var(--rail-w, 320px); border-right-color: var(--border); }
  #sidebar.resizing { transition: none; }
  #side-resize { position: absolute; top: 0; right: 0; bottom: 0; width: 5px; cursor: col-resize; z-index: 5; }
  #side-resize:hover, #sidebar.resizing #side-resize { background: var(--border); }
  /* The sidebar is THE tree, the shell's single view of nodes, outcomes, and
     sessions. Scope (click a node to view only its subtree), folds, and the
     active-only filter live here. Find (⌘/) focuses the filter input at the
     top; while it holds focus ("browsing") the tree gains a selection and
     the work pane previews the selected row's detail card. Agent state from
     screen diff: pulsing green = working, steady amber = waiting for you;
     services: steady blue = running. */
  #side-top {
    flex: none; display: flex; align-items: center; gap: 8px;
    padding: 8px 10px; border-bottom: 1px solid var(--border);
  }
  #find-wrap { position: relative; flex: 1; min-width: 0; }
  #find-input {
    width: 100%; padding: 5px 34px 5px 8px; border-radius: 6px;
    background: var(--bg); border: 1px solid var(--border); color: var(--text); font: inherit;
  }
  #find-input:focus { outline: none; border-color: var(--accent2); }
  #find-chord {
    position: absolute; right: 8px; top: 50%; transform: translateY(-50%);
    color: var(--dim); font-size: 10px; pointer-events: none;
  }
  /* The browse legend: every key that works while browsing, printed at the
     rail's bottom only while browsing. */
  #side-legend {
    display: none; flex: none; flex-wrap: wrap; gap: 4px 12px;
    padding: 8px 12px; border-top: 1px solid var(--border);
    color: var(--dim); font-size: 10px;
  }
  #sidebar.browsing #side-legend { display: flex; }
  #side-legend b { color: var(--text); font-weight: 600; }
  #panel { flex: 1; overflow: auto; padding: 8px 0 12px; }
  .panel-hint { margin: 10px 12px; color: var(--dim); font-size: 11px; }
  #panel .bt-row { margin: 0 4px; }
  .bt-node { color: var(--dim); font-size: 10px; flex: none; }
  .bt-row .bt-glyph.working { color: var(--accent); animation: chip-pulse 1.1s ease-in-out infinite; }
  .bt-row .bt-glyph.ready { color: #e3b341; }
  .up-row { color: var(--dim); }
  @keyframes chip-pulse { 50% { opacity: 0.2; } }
  #settings, #agent-panel {
    position: absolute; top: 44px; right: 10px; z-index: 10;
    width: 380px; padding: 10px 14px;
    background: var(--panel); border: 1px solid var(--border); border-radius: 8px;
    box-shadow: 0 8px 24px rgba(0, 0, 0, 0.5);
  }
  #settings[hidden], #agent-panel[hidden] { display: none; }
  #agent-input {
    width: 100%; margin-bottom: 6px; padding: 4px 8px; border-radius: 6px;
    background: var(--bg); border: 1px solid var(--border); color: var(--text); font: inherit;
  }
  #agent-input:focus { outline: none; border-color: var(--accent2); }
  .agent-row { display: flex; align-items: center; gap: 8px; }
  .agent-cmd {
    flex: 1; text-align: left; background: none; border: none;
    color: var(--text); padding: 3px 4px; border-radius: 5px;
  }
  .agent-cmd:hover { color: var(--accent2); }
  .agent-row.current .agent-cmd { color: var(--accent); }
  .agent-del { background: none; border: none; color: var(--dim); padding: 0 4px; }
  .agent-del:hover { color: var(--text); }
  .s-title {
    display: flex; justify-content: space-between; align-items: center;
    color: var(--dim); font-size: 11px; text-transform: uppercase; letter-spacing: 1px;
    margin-bottom: 6px;
  }
  #s-reset { background: none; border: none; color: var(--dim); font-size: 11px; text-transform: none; letter-spacing: 0; }
  #s-reset:hover { color: var(--accent2); }
  .s-row { display: flex; align-items: center; gap: 8px; padding: 4px 0; }
  .s-label { flex: 1; }
  .s-when { color: var(--dim); font-size: 11px; width: 52px; }
  .s-chord {
    min-width: 92px; text-align: center; padding: 3px 8px; border-radius: 6px;
    border: 1px solid var(--border); background: var(--bg); color: var(--text);
  }
  .s-chord.recording { border-color: var(--accent2); color: var(--accent2); }
  .s-chord.unbound { color: var(--dim); }
  .s-note { font-size: 10px; color: var(--dim); width: 84px; text-align: right; }
  .s-hint { color: var(--dim); font-size: 11px; margin-top: 8px; }
  #mic-btn.rec { color: #f85149; border-color: #f85149; animation: chip-pulse 1.1s ease-in-out infinite; }
  /* Voice HUD: one pill, bottom center. listening (red) -> transcribing
     (blue) -> what happened (green) or what went wrong (amber). */
  #voice-hud {
    position: absolute; left: 50%; bottom: 20px; transform: translateX(-50%);
    z-index: 33; display: none; align-items: center; gap: 8px;
    max-width: min(680px, 85%); padding: 7px 16px; border-radius: 999px;
    background: var(--panel); border: 1px solid var(--border);
    box-shadow: 0 8px 24px rgba(0, 0, 0, 0.5); font-size: 12px;
  }
  #voice-hud.show { display: flex; }
  #voice-hud .vh-dot { flex: none; font-size: 10px; color: var(--dim); }
  #voice-hud.listening .vh-dot { color: #f85149; animation: chip-pulse 1.1s ease-in-out infinite; }
  #voice-hud.busy .vh-dot { color: var(--accent2); animation: chip-pulse 1.1s ease-in-out infinite; }
  #voice-hud.done .vh-dot { color: var(--accent); }
  #voice-hud.error .vh-dot { color: #e3b341; }
  #voice-hud .vh-text { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  /* Typed command bar: the voice grammar over a keyboard. Same spot as the
     HUD so both lanes read as one surface. */
  #cmd-bar {
    position: absolute; left: 50%; bottom: 20px; transform: translateX(-50%);
    z-index: 32; width: min(680px, 85%); padding: 7px 12px; border-radius: 999px;
    background: var(--panel); border: 1px solid var(--accent2);
    box-shadow: 0 8px 24px rgba(0, 0, 0, 0.5);
  }
  #cmd-bar[hidden] { display: none; }
  #cmd-bar input {
    width: 100%; background: none; border: none; outline: none;
    color: var(--text); font: inherit;
  }
  /* Outcome strip: any session being viewed wears its purpose — one line,
     nothing else, so a session can never again be a mystery. */
  #outcome-strip {
    display: none; align-items: baseline; gap: 8px; overflow: hidden;
    padding: 4px 14px; background: var(--panel); border-bottom: 1px solid var(--border);
    flex: none; font-size: 12px; white-space: nowrap;
  }
  #outcome-strip.show { display: flex; }
  #outcome-strip .ts-node { color: var(--accent2); flex: none; }
  #outcome-strip .ts-title { font-weight: 600; flex: none; }
  #outcome-strip .ts-outcome { color: var(--dim); overflow: hidden; text-overflow: ellipsis; }
  /* The outcome-row grammar, identical everywhere it appears (panel rows,
     tree rows, stage breakdown rows): status glyph, title, live-state dots. */
  .bt-row {
    display: flex; align-items: baseline; gap: 8px;
    padding: 6px 8px; border-radius: 6px; border: 1px solid transparent; cursor: pointer;
  }
  .bt-row:hover { background: rgba(255,255,255,0.04); }
  .bt-glyph { flex: none; width: 14px; text-align: center; color: var(--dim); }
  .bt-title { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .bt-meta { margin-left: auto; color: var(--dim); font-size: 11px; flex: none; }
  .bt-row.done { color: var(--dim); }
  .bt-row.done .bt-title { text-decoration: line-through; }
  .bt-row.done .bt-glyph { color: var(--accent); }
  .bt-row.active .bt-glyph { color: var(--accent2); }
  .bt-row.waiting .bt-glyph { color: #e3b341; }
  .bt-row.next { border-color: var(--accent); }
  .bt-row.next .bt-glyph { color: var(--accent); }
  .bt-next-tag { margin-left: auto; color: var(--accent); font-size: 10px; text-transform: uppercase; letter-spacing: 1px; flex: none; }
  /* The kill ✕ every tree row wears while its session is live, because the
     rail is what actually gets watched. Always drawn, never hover-only: a
     way to stop a runaway agent must not be a hidden feature. Dim until the
     pointer is on it, red when it is. */
  .row-kill {
    flex: none; margin-left: auto; padding: 0 4px; border: none; background: none;
    color: var(--dim); font: inherit; font-size: 11px; line-height: 1; opacity: 0.5;
  }
  .row-kill:hover { color: #f85149; opacity: 1; }
  .bt-meta + .row-kill, .bt-next-tag + .row-kill, .bt-node + .row-kill, .cr-meta + .row-kill { margin-left: 6px; }
  /* Node rows: a node's header row IS its main agent (dot only while live),
     outcomes nested by breakdown, process sessions underneath. Nodes fold
     (chevron / arrow keys); a folded node prints what it hides, so hiding
     stays deliberate and activity never vanishes. */
  .cr-node { display: flex; align-items: baseline; gap: 8px; padding: 10px 8px 4px; border-radius: 6px; }
  .cr-node:hover { background: rgba(255,255,255,0.04); }
  .cr-path { color: var(--accent2); flex: none; }
  .cr-purpose { color: var(--dim); font-size: 11px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .cr-fold { flex: none; width: 12px; text-align: center; color: var(--dim); font-size: 10px; }
  .cr-fold:hover { color: var(--text); }
  .cr-meta { margin-left: auto; color: var(--dim); font-size: 11px; flex: none; }
  .cr-meta.live { color: var(--accent); }
  .cr-sel { background: rgba(88, 166, 255, 0.15); outline: 1px solid var(--accent2); }
  .md-node { color: var(--accent2); font-size: 12px; }
  .md-title { font-size: 17px; font-weight: 700; margin-top: 4px; }
  .md-label { color: var(--dim); font-size: 11px; text-transform: uppercase; letter-spacing: 1px; display: block; margin: 14px 0 2px; }
  .md-text { font-size: 12px; white-space: pre-wrap; }
  .md-sess { display: flex; align-items: center; gap: 6px; margin-top: 14px; font-size: 12px; color: var(--dim); }
  .md-actions { display: flex; gap: 8px; margin-top: 18px; flex-wrap: wrap; }
  .md-btn {
    padding: 5px 12px; border-radius: 6px; border: 1px solid var(--border);
    background: transparent; color: var(--text); font-size: 12px;
  }
  .md-btn:hover { border-color: var(--dim); }
  .md-btn.primary { color: var(--accent); border-color: var(--accent); }
  .md-btn.danger:hover { color: #f85149; border-color: #f85149; }
  .md-btn .key { color: var(--dim); margin-left: 6px; }
  /* The card: a tree row's detail, shown in the terminal area. Browsing
     (find focused) previews the selected row's card live; opening an outcome
     with no agent pins its card (the stage). Viewing a card never starts
     anything. */
  #stage {
    position: absolute; inset: 0; z-index: 5; display: none;
    align-items: center; justify-content: center; overflow: auto; background: var(--bg);
  }
  #stage.show { display: flex; }
  .stage-box {
    width: min(560px, 90%); max-height: 90%; overflow: auto; padding: 24px 28px;
    border: 1px solid var(--border); border-radius: 12px; background: var(--panel);
  }
  .stage-box .md-actions { margin-top: 22px; }
  #work { flex: 1; display: flex; flex-direction: column; min-width: 0; }
  #terms { flex: 1; position: relative; min-height: 0; }
  .term-host { position: absolute; inset: 0; padding: 8px; display: none; }
  .term-host.visible { display: block; }
  .xterm { height: 100%; }
</style>
</head>
<body>
<div id="app">
  <header>
    <button id="tree-btn" class="hbtn" title="show or hide the tree rail">☰</button>
    <span class="brand"><span class="dot">●</span> agent shell</span>
    <span id="active-label"></span>
    <button id="kill-btn" class="hbtn danger" hidden title="kill the session on screen — everything running inside it stops">✕ kill</button>
    <button id="talk-btn" class="hbtn" title="type a command — routed exactly like voice">talk ⌘K</button>
    <button id="chat-btn" class="hbtn" title="root main — everything not addressed to a node lands here">⌂ root</button>
    <button id="agent-btn" class="hbtn" title="orchestrator agent, click to switch"></button>
    <button id="mic-btn" class="hbtn" title="voice — hold ⌥ and speak (release to send), or tap ⌥ to latch (tap again to send). ⇧ or ↑ while holding locks the recording.">🎙</button>
    <button id="caffeine-btn" class="hbtn" title="keep mac awake (caffeinate -di)">☕</button>
    <button id="keys-btn" class="hbtn" title="keyboard shortcuts">⌘</button>
  </header>
  <div id="settings" hidden>
    <div class="s-title">keyboard shortcuts <button id="s-reset">reset defaults</button></div>
    <div id="s-rows"></div>
    <div class="s-hint">click a chord, then press the new keys. esc cancels, backspace unbinds.</div>
  </div>
  <div id="agent-panel" hidden>
    <div class="s-title">orchestrator agent</div>
    <input id="agent-input" placeholder="command, e.g. claude-otto or pi" spellcheck="false" />
    <div id="agent-rows"></div>
    <div class="s-hint">any command, alias, or flags your shell understands. switching kills the running root agent and respawns it with the new command.</div>
  </div>
  <div id="main">
    <div id="sidebar" class="open">
      <div id="side-top">
        <div id="find-wrap">
          <input id="find-input" placeholder="find a node, person, or outcome" spellcheck="false" />
          <span id="find-chord"></span>
        </div>
        <button id="side-live" class="hbtn" title="show only active work — live agents, running services, active outcomes">◉ active</button>
      </div>
      <div id="panel"></div>
      <div id="side-legend"><span><b>↑↓</b> move</span><span><b>←→</b> fold</span><span><b>⏎</b> open</span><span><b>⌫</b> up</span><span id="legend-kill"><b>⌘D</b> kill</span><span><b>esc</b> back</span></div>
      <div id="side-resize" title="drag to resize"></div>
    </div>
    <div id="work">
      <div id="outcome-strip">
        <span class="ts-node"></span><span class="ts-title"></span><span class="ts-outcome"></span>
      </div>
      <div id="terms"><div id="stage"></div></div>
    </div>
  </div>
  <div id="voice-hud"><span class="vh-dot">●</span><span class="vh-text"></span></div>
  <div id="cmd-bar" hidden><input id="cmd-input" placeholder="type what you'd say — routed exactly like voice" spellcheck="false" /></div>
</div>
<script src="/vendor/xterm/xterm.js"></script>
<script src="/vendor/xterm/addon-fit.js"></script>
<script src="/keymap.js"></script>
<script src="/config.js"></script>
<script>
const CHAT = window.CHAT_SESSION ?? "chat";
const terms = new Map(); // session name -> {term, fit, ws, host}
let active = null;

const termsEl = document.getElementById("terms");
const treeBtn = document.getElementById("tree-btn");
const sidebarEl = document.getElementById("sidebar");
const activeLabel = document.getElementById("active-label");
const stageEl = document.getElementById("stage");

function connect(session) {
  if (terms.has(session)) return terms.get(session);
  const host = document.createElement("div");
  host.className = "term-host";
  termsEl.appendChild(host);

  const term = new Terminal({
    fontFamily: '"SF Mono", Menlo, monospace',
    fontSize: 13,
    theme: { background: "#0d1117", foreground: "#e6edf3", cursor: "#3fb950" },
    cursorBlink: true,
    scrollback: 5000,
  });
  const fit = new FitAddon.FitAddon();
  term.loadAddon(fit);
  term.open(host);
  fit.fit();

  const ws = new WebSocket(
    `ws://${location.host}/term?session=${encodeURIComponent(session)}&cols=${term.cols}&rows=${term.rows}`
  );
  ws.onopen = () => ws.send("\x00resize:" + term.cols + "x" + term.rows);
  ws.onmessage = (e) => term.write(e.data);
  const connectedAt = Date.now();
  ws.onclose = () => {
    // Session client ended (e.g. session was killed): drop the terminal and
    // fall back to chat.
    dispose(session);
    if (active === session && !(session === CHAT && chatDiedFast(connectedAt))) show(CHAT);
    renderSidebar();
  };
  // Shift+Enter inserts a newline instead of submitting: xterm would send a
  // plain \r, so send ESC+\r (what Claude Code's /terminal-setup binding
  // emits) which the agent treats as a literal newline.
  //
  // The event has to be blocked twice. Blocking keydown alone still submits:
  // xterm returns early without preventDefault, the browser then fires
  // keypress for Enter, and xterm's keypress path writes the plain \r. So
  // cancel the keydown (which suppresses keypress) AND refuse the keypress
  // if the browser fires it anyway. keyup passes through so xterm keeps its
  // own key bookkeeping.
  term.attachCustomKeyEventHandler((e) => {
    if (e.key !== "Enter" || !e.shiftKey) return true;
    if (e.type === "keydown") {
      e.preventDefault();
      if (ws.readyState === 1) ws.send("\x1b\r");
    }
    return e.type === "keyup";
  });
  term.onData((d) => { if (ws.readyState === 1) ws.send(d); });
  term.onResize(({ cols, rows }) => {
    if (ws.readyState === 1) ws.send("\x00resize:" + cols + "x" + rows);
  });

  const entry = { term, fit, ws, host };
  terms.set(session, entry);
  return entry;
}

// A broken agent command makes the chat session die the moment it spawns,
// and blind reconnection would spin in a spawn/die loop. Three fast deaths
// in a row stop the auto-reconnect and open the agent picker instead;
// switching (or re-picking the current agent) reconnects.
let chatDeaths = 0;
function chatDiedFast(connectedAt) {
  if (Date.now() - connectedAt > 1500) {
    chatDeaths = 0;
    return false;
  }
  if (++chatDeaths < 3) return false;
  chatDeaths = 0;
  alert(`root agent "${agentCmd}" keeps dying right after start. pick another command.`);
  if (agentPanel.hidden) agentBtn.onclick();
  return true;
}

function dispose(session) {
  const e = terms.get(session);
  if (!e) return;
  terms.delete(session);
  try { e.ws.onclose = null; e.ws.close(); } catch {}
  e.term.dispose();
  e.host.remove();
}

function show(session) {
  const entry = connect(session);
  active = session;
  stageOn = false;
  stageFile = null;
  stageEl.classList.remove("show");
  for (const [name, e] of terms) e.host.classList.toggle("visible", name === session);
  activeLabel.textContent = session === CHAT ? "root" : session;
  requestAnimationFrame(() => { entry.fit.fit(); entry.term.focus(); });
  renderSidebar();
  renderOutcomeStrip();
  renderKillBtn();
}

// Detach only: close our client connection, keep the tmux session alive.
// Reached via the close-session shortcut and the voice close_view action;
// "back to root" is otherwise just clicking the root node in the tree.
function closeSessionView() {
  if (active === CHAT) return;
  dispose(active);
  show(CHAT);
}

function refitActive() {
  const e = active && terms.get(active);
  if (!e) return;
  e.fit.fit();
  // Refit is a layout concern only. It runs on strip show/hide, rail resize,
  // and window resize, and entering browse hides the strip: focusing the
  // terminal here would instantly steal focus back from the find input and
  // bounce the user straight out of browsing.
  if (!browsing && !(document.activeElement instanceof HTMLInputElement)) e.term.focus();
}

treeBtn.onclick = () => {
  sidebarEl.classList.toggle("open");
  treeBtn.classList.toggle("on", sidebarEl.classList.contains("open"));
};
treeBtn.classList.add("on"); // the rail starts open
sidebarEl.addEventListener("transitionend", refitActive);

// The rail's width is draggable at its right edge, persisted like folds and
// scope so a reload keeps the layout.
const RAIL_STORE = "agent-shell-rail-width";
const railStored = Number(localStorage.getItem(RAIL_STORE));
if (railStored) sidebarEl.style.setProperty("--rail-w", railStored + "px");
const railHandle = document.getElementById("side-resize");
railHandle.addEventListener("pointerdown", (e) => {
  e.preventDefault();
  railHandle.setPointerCapture(e.pointerId);
  sidebarEl.classList.add("resizing");
  const left = sidebarEl.getBoundingClientRect().left;
  let w = 0, raf = 0;
  const move = (ev) => {
    w = Math.max(200, Math.min(ev.clientX - left, window.innerWidth * 0.6));
    sidebarEl.style.setProperty("--rail-w", w + "px");
    if (!raf) raf = requestAnimationFrame(() => { raf = 0; refitActive(); });
  };
  const up = () => {
    railHandle.removeEventListener("pointermove", move);
    railHandle.removeEventListener("pointerup", up);
    sidebarEl.classList.remove("resizing");
    if (w) localStorage.setItem(RAIL_STORE, String(Math.round(w)));
    refitActive();
  };
  railHandle.addEventListener("pointermove", move);
  railHandle.addEventListener("pointerup", up);
});

// ---- the sidebar ----
// The sidebar shows THE tree, the shell's one and only view of it. There is
// no separate working view; working IS looking at the tree next to a
// session. There is no focus concept either: the user scopes the tree to a
// subtree themselves, starts outcomes going, and attends to whatever the
// tree shows needs attention. Find (⌘/) focuses the filter input; while it
// holds focus ("browsing") the tree gains a selection (arrows and hover) and
// the work pane previews the selected row's card in place of the terminal.

let lastSessions = [];
let stageOn = false;   // the terminal area shows an outcome (stage), not a session
let stageFile = null;  // which outcome file the stage shows

const panelEl = document.getElementById("panel");

document.getElementById("chat-btn").onclick = () => show(CHAT);

async function refreshSessions() {
  try {
    const res = await fetch("/api/sessions");
    const { agent, caffeinate, voice, sessions } = await res.json();
    if (agent) setAgentCmd(agent);
    setCaffeineState(caffeinate);
    micBtn.style.display = voice === false ? "none" : "";
    lastSessions = sessions;
    renderSidebar();
    renderCard();
    renderOutcomeStrip();
    renderKillBtn();
  } catch {}
}

// The vault poll: agents write outcome files while the user watches (the
// "turn my words into breakdowns" story), so every surface showing the tree
// re-reads and re-renders in place.
async function refreshVault() {
  await fetchVault(true);
  renderSidebar();
  renderCard();
}

const STATE_HINT = {
  working: "agent working",
  waiting: "agent waiting for you",
  shell: "shell (no agent running)",
  service: "service running",
  stopped: "service stopped (open to restart)",
};

const SESSION_LABEL = {
  working: "agent working",
  waiting: "agent ready for you",
  shell: "shell (agent exited)",
  service: "service running",
  stopped: "service stopped",
};

/**
 * A live session's one-line label. A just-spawned session's pane still runs
 * the shell while the agent boots, which must not read as "agent exited".
 */
function sessionLabel(t) {
  if (!t.sessionLive) return null;
  if (t.sessionState === "shell" && t.sessionCreated && Date.now() - t.sessionCreated < 10000) return "agent starting…";
  return SESSION_LABEL[t.sessionState] ?? "session live";
}

/** A colored status glyph for an outcome's live session (or lack of one). */
function sessionGlyph(t) {
  const dot = document.createElement("span");
  dot.className = "bt-glyph" + (t.sessionState === "working" ? " working" : t.sessionState === "waiting" ? " ready" : "");
  dot.textContent = t.sessionLive ? "●" : "○";
  return dot;
}

/**
 * The kill ✕ a tree row wears while its session is live. Every row that has
 * something running carries one, because stopping a
 * runaway agent has to be reachable from the rail the user actually watches.
 * The event stops here so the ✕ never doubles as "open this row".
 */
function killBtnEl(name) {
  const b = document.createElement("button");
  b.className = "row-kill";
  b.textContent = "✕";
  const chord = chordFor("kill-session");
  b.title = "kill " + name + " — everything running inside it stops" + (chord ? " (" + chord + " kills what is in front of you)" : "");
  b.onmousedown = (e) => {
    e.preventDefault();
    e.stopPropagation();
  };
  b.onclick = (e) => {
    e.stopPropagation();
    killSession(name);
  };
  return b;
}

/** One breakdown child row: status glyph, title, live agent dot; a live child's row opens its session. */
function childRowEl(c, isNext) {
  const s = sessionFor(c.session);
  const row = document.createElement("div");
  row.className = "bt-row " + c.status + (isNext ? " next" : "");
  const glyph = document.createElement("span");
  glyph.className = "bt-glyph" + (s?.state === "working" ? " working" : s?.state === "waiting" ? " ready" : "");
  glyph.textContent = s ? "●" : OUTCOME_GLYPH[c.status] ?? "○";
  const title = document.createElement("span");
  title.className = "bt-title";
  title.textContent = c.title;
  row.append(glyph, title);
  if (isNext) {
    const tag = document.createElement("span");
    tag.className = "bt-next-tag";
    tag.textContent = "next";
    row.appendChild(tag);
  }
  if (s) {
    row.title = "agent session live — click to view";
    row.style.cursor = "pointer";
    row.onclick = () => show(s.name);
    row.appendChild(killBtnEl(s.name));
  }
  return row;
}

/** The tmux session name a tree item's row represents, or null. */
function itemSession(item) {
  if (item.kind === "outcome") return sessionFor(item.t.session)?.name ?? null;
  if (item.kind === "main") return item.s?.name ?? null;
  if (item.kind === "process") return item.s.name;
  return null;
}

/** A cheap signature of everything a tree render depends on. */
function treeStateKey(items) {
  return JSON.stringify([
    active,
    treeScope,
    liveOnly,
    [...folded],
    items.map((it) =>
      it.kind === "outcome" ? ["o", it.t.file, it.t.status, it.next]
      : it.kind === "main" ? ["n", it.g.path, it.s?.state ?? null, it.fold.folded, it.fold.hiddenCount, it.fold.hiddenLive]
      : it.kind === "process" ? ["p", it.s.name, it.s.state]
      : ["up", it.to]),
    lastSessions.map((s) => [s.name, s.state]),
  ]);
}

// Find and browse state. The input's focus IS the mode: focused = browsing.
const findInput = document.getElementById("find-input");
let browsing = false;
let sideItems = []; // selectable rows: {kind:"main"|"outcome"|"process"|"up", ...}
let sideRows = [];  // the DOM row per item
let sideSel = 0;

let panelKey = "";
function renderSidebar(force = false) {
  const q = findInput.value.trim();
  const items = buildTreeItems(q);
  // Rebuild only on real state change so hover targets stay stable.
  const key = q + "\n" + browsing + "\n" + treeStateKey(items);
  if (!force && key === panelKey) return;
  panelKey = key;
  const prevItem = sideItems[sideSel];
  sideItems = items;
  sideRows = [];
  panelEl.innerHTML = "";
  if (!items.length) {
    const el = document.createElement("div");
    el.className = "panel-hint";
    el.textContent = q ? "nothing matches" : liveOnly ? "nothing is active right now" : "the vault has no nodes yet";
    panelEl.appendChild(el);
    renderCard(true);
    return;
  }
  items.forEach((item, idx) => {
    const row = treeRowEl(item);
    row.style.cursor = "pointer";
    if (!browsing && itemSession(item) === active && active) row.classList.add("cr-sel");
    row.onmouseenter = () => {
      if (browsing) setSideSel(idx, false);
    };
    row.onmousedown = (e) => {
      e.preventDefault();
      // Clicking the tree is the mouse way into browsing: the pane you
      // clicked becomes the pane the arrow keys drive.
      if (!browsing) findInput.focus();
      setSideSel(idx, false);
      activateTreeItem(item);
    };
    panelEl.appendChild(row);
    sideRows.push(row);
  });
  if (browsing) {
    // Keep the selection on the same item across rebuilds.
    const same = (a, b) =>
      a && b && a.kind === b.kind &&
      (a.kind === "outcome" ? a.t.file === b.t.file
        : a.kind === "main" ? a.g.path === b.g.path
        : a.kind === "process" ? a.s.name === b.s.name
        : true);
    const idx = sideItems.findIndex((it) => same(it, prevItem));
    sideSel = idx >= 0 ? idx : 0;
    paintSideSel(false);
  } else {
    renderCard();
  }
}

function setSideSel(idx, scroll = true) {
  sideSel = idx;
  paintSideSel(scroll);
}

function moveSideSel(delta) {
  if (!sideItems.length) return;
  setSideSel((sideSel + delta + sideItems.length) % sideItems.length);
}

function paintSideSel(scroll = true) {
  panelEl.querySelectorAll(".cr-sel").forEach((el) => el.classList.remove("cr-sel"));
  const el = sideRows[sideSel];
  if (el) {
    el.classList.add("cr-sel");
    if (scroll) el.scrollIntoView({ block: "nearest" });
  }
  renderCard();
}

/** The one spawn affordance: start (or reattach) an outcome's agent session. */
async function startAgent(file) {
  hud("busy", "starting agent…");
  try {
    const res = await fetch("/api/outcome/start", {
      method: "POST",
      headers: { "content-type": "application/json" },
      body: JSON.stringify({ file }),
    });
    const out = await res.json();
    if (!res.ok) throw new Error(out.error ?? "start failed " + res.status);
    show(out.session);
    hud("done", (out.reattached ? "reattached " : "agent started: ") + out.session);
    refreshVault();
  } catch (err) {
    hud("error", String(err.message ?? err));
  }
}

// ---- the card ----
// The work pane's second face: a tree row's detail, rendered where the
// terminal goes. Two ways in: browsing (find focused) previews the selected
// row live, and opening an outcome with no agent pins its card (the stage).
// Viewing a card never starts anything; "start agent" is the explicit action.

function openOutcomeView(file) {
  stageFile = file;
  stageOn = true;
  for (const [, e] of terms) e.host.classList.remove("visible");
  activeLabel.textContent = "";
  renderCard(true);
  renderSidebar(true);
  renderOutcomeStrip();
  renderKillBtn();
}

/** The tree item the card should show right now, or null (terminal shows). */
function cardItem() {
  if (browsing) return sideItems[sideSel] ?? null;
  if (stageOn && stageFile) {
    const t = outcomeByFile.get(stageFile);
    if (t) return { kind: "outcome", t };
    // The outcome vanished (dropped, deferred, or deleted): nothing to pin.
    stageOn = false;
    stageFile = null;
  }
  return null;
}

/** A cheap signature of everything the card render depends on. */
function cardKeyOf(item) {
  const skey = (s) => (s ? [s.name, s.state] : null);
  if (item.kind === "outcome") {
    const t = item.t;
    const kids = (t.breakdown ?? []).map((slug) => outcomeBySlug.get(slug)).filter(Boolean);
    return JSON.stringify([
      "o", browsing, t.file, t.status, t.stateText, skey(sessionFor(t.session)),
      kids.map((c) => [c.status, skey(sessionFor(c.session))]),
    ]);
  }
  if (item.kind === "main") {
    return JSON.stringify(["n", item.g.path, item.g.purpose, skey(item.s), item.foldable && folded.has(item.g.path)]);
  }
  if (item.kind === "process") return JSON.stringify(["p", item.s.name, item.s.state]);
  return JSON.stringify(["up", item.to]);
}

let cardKey = "";
function renderCard(force = false) {
  const item = cardItem();
  if (!item) {
    cardKey = "";
    stageEl.classList.remove("show");
    return;
  }
  const key = cardKeyOf(item);
  if (!force && key === cardKey && stageEl.classList.contains("show")) return;
  cardKey = key;
  stageEl.innerHTML = "";
  const box = document.createElement("div");
  box.className = "stage-box";
  /** Appends one element with a class and text; returns it. */
  const el = (tag, cls, text) => {
    const x = document.createElement(tag);
    x.className = cls;
    if (text != null) x.textContent = text;
    box.appendChild(x);
    return x;
  };
  /** One labeled text block. */
  const block = (label, text) => {
    if (!text) return;
    el("span", "md-label", label);
    el("div", "md-text", text);
  };
  /**
   * One action button with its printed key. mousedown preventDefault keeps
   * the find input focused, so clicking a card button never exits browsing
   * by accident.
   */
  const btn = (parent, label, keyHint, fn, cls) => {
    const b = document.createElement("button");
    b.className = "md-btn" + (cls ? " " + cls : "");
    b.textContent = label;
    if (keyHint) {
      const k = document.createElement("span");
      k.className = "key";
      k.textContent = keyHint;
      b.appendChild(k);
    }
    b.onmousedown = (e) => e.preventDefault();
    b.onclick = fn;
    parent.appendChild(b);
  };
  /** A session-state line. */
  const sessLine = (s) => {
    const info = { sessionLive: Boolean(s), sessionState: s?.state ?? null, sessionCreated: s?.created ?? null };
    const line = el("div", "md-sess");
    line.append(sessionGlyph(info), document.createTextNode(sessionLabel(info) ?? "no agent yet"));
  };
  if (item.kind === "up") {
    el("div", "md-title", "back up");
    el("div", "md-text", "Widen the view " + (item.to ? "to " + item.to : "to the whole tree") + ".");
    const a = el("div", "md-actions");
    btn(a, "go up", "⌫", () => setScope(item.to), "primary");
  } else if (item.kind === "outcome") {
    const t = item.t;
    el("div", "md-node", t.node);
    el("div", "md-title", t.title);
    block("done looks like", t.outcome);
    block("where it stands", t.stateText);
    const kids = (t.breakdown ?? []).map((slug) => outcomeBySlug.get(slug)).filter(Boolean);
    if (kids.length) {
      el("span", "md-label", "breakdown");
      const nextChild = kids.find((c) => c.status !== "done" && c.status !== "dropped");
      for (const c of kids) box.appendChild(childRowEl(c, c === nextChild));
    }
    const s = sessionFor(t.session);
    sessLine(s);
    const a = el("div", "md-actions");
    if (s) {
      btn(a, "open agent", browsing ? "⏎" : "", () => show(s.name), "primary");
      btn(a, "kill ✕", chordFor("kill-session"), () => killSession(s.name), "danger");
    } else if (!["done", "dropped"].includes(t.status)) {
      btn(a, "▸ start agent", "", () => startAgent(t.file), "primary");
    }
    if (!a.children.length) a.remove();
  } else if (item.kind === "main") {
    el("div", "md-node", item.g.path || "root");
    el("div", "md-title", item.g.name || "root");
    el(
      "div",
      "md-text",
      (item.g.purpose ? item.g.purpose + "\n\n" : "") +
        (item.g.path
          ? "The node's main agent. Node-level commands — run a routine, reorganize the tree, open sessions — route here. Speak or type (⌥ / ⌘K) starting with the node's name to instruct it from here: \"" + item.g.name + ", turn this into outcome breakdowns: …\""
          : "Root main. Anything not addressed to a specific node lands here — creating nodes, capturing outcomes, organizing the whole tree.")
    );
    sessLine(item.s);
    const a = el("div", "md-actions");
    if (item.g.path) btn(a, "view subtree", "⏎", () => setScope(item.g.path), "primary");
    btn(
      a,
      item.s ? "open main" : "start main",
      item.g.path ? "" : "⏎",
      () => (item.g.path ? openNodeMain(item.g.path) : show(CHAT)),
      item.g.path ? "" : "primary"
    );
    if (item.foldable) {
      const isFolded = folded.has(item.g.path);
      btn(a, isFolded ? "unfold" : "fold", isFolded ? "→" : "←", () => toggleFold(item.g.path));
    }
    if (item.s && !item.s.isChat && item.s.name !== CHAT) {
      btn(a, "kill ✕", chordFor("kill-session"), () => killSession(item.s.name), "danger");
    }
  } else {
    el("div", "md-node", item.s.node ?? "");
    el("div", "md-title", item.s.name);
    el("div", "md-text", STATE_HINT[item.s.state] ?? "");
    const a = el("div", "md-actions");
    btn(a, "view", "⏎", () => show(item.s.name), "primary");
    btn(a, "kill ✕", chordFor("kill-session"), () => killSession(item.s.name), "danger");
  }
  stageEl.appendChild(box);
  stageEl.classList.add("show");
}

// ---- keyboard shortcuts ----
// The shortcut editor (⌘ button) is the primary surface: click a chord, press
// the new keys, saved to localStorage. /keymap.js only supplies factory
// defaults. Every action names a context ("when"), because the same chord
// means different things in different states: cmd+w in a session view
// detaches back to chat, while cmd+w in chat keeps its browser meaning.

async function killSession(name) {
  if (!name || name === CHAT) return;
  // The confirm dialog steals focus, which would silently end browsing;
  // killing a row from the tree should leave you browsing the tree.
  const wasBrowsing = browsing;
  const refocus = () => { if (wasBrowsing) findInput.focus(); };
  if (!confirm(`Kill tmux session "${name}"? Processes inside it will stop.`)) return refocus();
  const res = await fetch(`/api/kill/${encodeURIComponent(name)}`, { method: "POST" });
  if (!res.ok) {
    hud("error", `kill failed: ${(await res.json()).error ?? res.status}`);
    refocus();
    return;
  }
  hud("done", "killed " + name);
  // Killing the viewed session: tmux drops our client, the socket closes, and
  // ws.onclose falls back to chat. Every surface still needs the session list
  // refreshed, and the vault too — the server's reconciler flips an outcome
  // whose session died back from active.
  refreshSessions();
  refreshVault();
  refocus();
}

/**
 * Kill what is in front of you (⌘D). While browsing, the selected row's card
 * fills the work pane, so the chord kills that row's session; otherwise it
 * kills the session filling the terminal area. Root main is the shell's
 * home and is never killed — the chord says so rather than failing silently.
 */
function killVisibleSession() {
  if (browsing) {
    const name = sideItems[sideSel] ? itemSession(sideItems[sideSel]) : null;
    if (!name) return hud("error", "that row has no session to kill");
    if (name === CHAT) return hud("error", "root main can't be killed — it is the shell's home");
    return killSession(name);
  }
  if (stageOn) return hud("error", "no session on screen — this outcome has no agent yet");
  if (!active || active === CHAT) return hud("error", "root main can't be killed — it is the shell's home");
  killSession(active);
}

// The chord's printed home: whenever a killable session fills the view, the
// header carries the same action as a button wearing ⌘D. Root main and the
// outcome stage have nothing to kill, so the button is not there.
const killBtn = document.getElementById("kill-btn");
killBtn.onclick = () => killVisibleSession();

function renderKillBtn() {
  killBtn.hidden = browsing || stageOn || !active || active === CHAT;
}

// The chord vocabulary stays tiny and every chord is printed on the control it
// drives: ⌘D on the header's kill button and in the tree legend, and on every
// kill button in the tree's detail pane. Switching agents stays a visible
// button with no chord.
// defaultKeys is the built-in factory chord: /keymap.js may override it, but
// a missing or stale-cached /keymap.js can never silently unbind an action.
// `was` names an action's previous name, so a binding stored under the old
// name keeps working after a rename ("map" became "find").
const ACTION_META = [
  { action: "close-session", label: "close session view (detach)", when: "session", defaultKeys: "cmd+w" },
  { action: "kill-session", label: "kill the session in front of you", when: "any", defaultKeys: "cmd+d" },
  { action: "find", label: "find in the tree", when: "any", defaultKeys: "cmd+/", was: "map" },
  { action: "talk", label: "typed command (voice grammar)", when: "any", defaultKeys: "cmd+k" },
];

const ACTIONS = {
  "close-session": closeSessionView,
  "kill-session": () => killVisibleSession(),
  "find": () => toggleFind(),
  "talk": () => openCmdBar(),
};

const KEYMAP_STORE = "agentshell.keymap";

// The live keymap: one entry per action, keys possibly null (unbound).
// Precedence: localStorage (the editor's saves, old action name accepted)
// over /keymap.js over the built-in defaults.
function loadKeymap() {
  let stored = {};
  try { stored = JSON.parse(localStorage.getItem(KEYMAP_STORE)) ?? {}; } catch {}
  return ACTION_META.map((m) => {
    const fromFile = (window.KEYMAP ?? []).find((b) => b.action === m.action)?.keys;
    const keys =
      m.action in stored ? stored[m.action]
      : m.was && m.was in stored ? stored[m.was]
      : fromFile !== undefined ? fromFile
      : m.defaultKeys;
    return { ...m, keys };
  });
}
let keymap = loadKeymap();

function saveKeymap() {
  const out = {};
  for (const b of keymap) out[b.action] = b.keys;
  localStorage.setItem(KEYMAP_STORE, JSON.stringify(out));
  lockKeymapKeys();
  paintChordHints();
  renderSettings();
}

/** A chord in printed form: "cmd+shift+d" -> "⌘⇧D". */
function prettyChord(keys) {
  if (!keys) return "";
  const c = parseChord(keys);
  const glyph = { "/": "/", escape: "esc", enter: "⏎", backspace: "⌫" }[c.key] ?? c.key.toUpperCase();
  return (c.ctrl ? "⌃" : "") + (c.alt ? "⌥" : "") + (c.shift ? "⇧" : "") + (c.meta ? "⌘" : "") + glyph;
}

/** The printed chord for an action, "" when it is unbound. */
function chordFor(action) {
  return prettyChord(keymap.find((b) => b.action === action)?.keys ?? null);
}

/**
 * Every chord is printed on the control it drives, so the printed text is read
 * from the live keymap: rebinding in the editor must move the label with it,
 * or the shell teaches a shortcut that no longer works.
 */
function paintChordHints() {
  const set = (id, text) => {
    const el = document.getElementById(id);
    if (el) el.textContent = text;
  };
  set("find-chord", chordFor("find"));
  set("talk-btn", ("talk " + chordFor("talk")).trim());
  set("kill-btn", ("✕ kill " + chordFor("kill-session")).trim());
  const legend = document.querySelector("#legend-kill b");
  if (legend) legend.textContent = chordFor("kill-session") || "the ✕";
  renderSidebar(true);
  renderCard(true);
}

function shellContext() {
  return active === CHAT ? "chat" : "session";
}

function parseChord(keys) {
  const parts = keys.toLowerCase().split("+");
  const key = parts.pop();
  return {
    key,
    meta: parts.includes("cmd") || parts.includes("meta"),
    ctrl: parts.includes("ctrl"),
    alt: parts.includes("alt") || parts.includes("option"),
    shift: parts.includes("shift"),
  };
}

function chordMatches(chord, e) {
  return (
    e.key.toLowerCase() === chord.key &&
    e.metaKey === chord.meta &&
    e.ctrlKey === chord.ctrl &&
    e.altKey === chord.alt &&
    e.shiftKey === chord.shift
  );
}

// ---- shortcut editor ----

const keysBtn = document.getElementById("keys-btn");
const settingsEl = document.getElementById("settings");
const settingsRows = document.getElementById("s-rows");
let recordingAction = null;

keysBtn.onclick = () => {
  settingsEl.hidden = !settingsEl.hidden;
  keysBtn.classList.toggle("on", !settingsEl.hidden);
  if (!settingsEl.hidden) closeAgentPanel(); // panels share the same corner
  recordingAction = null;
  renderSettings();
};

document.getElementById("s-reset").onclick = () => {
  localStorage.removeItem(KEYMAP_STORE);
  keymap = loadKeymap();
  lockKeymapKeys();
  renderSettings();
};

// Chords the browser or OS keeps to itself; shown as a warning in the editor.
function chordNote(keys) {
  if (!keys) return "";
  const c = parseChord(keys);
  if (c.meta && c.key === "q") return "never reaches the app";
  if (c.meta && ["w", "t", "n"].includes(c.key)) return "fullscreen only";
  return "";
}

function renderSettings() {
  if (settingsEl.hidden) return;
  settingsRows.innerHTML = "";
  for (const b of keymap) {
    const row = document.createElement("div");
    row.className = "s-row";
    const label = document.createElement("span");
    label.className = "s-label";
    label.textContent = b.label;
    const when = document.createElement("span");
    when.className = "s-when";
    when.textContent = b.when;
    const chord = document.createElement("button");
    const recording = recordingAction === b.action;
    chord.className = "s-chord" + (recording ? " recording" : b.keys ? "" : " unbound");
    chord.textContent = recording ? "press keys…" : b.keys ?? "unbound";
    chord.onclick = () => {
      recordingAction = recording ? null : b.action;
      renderSettings();
    };
    const note = document.createElement("span");
    note.className = "s-note";
    note.textContent = recording ? "" : chordNote(b.keys);
    row.append(label, when, chord, note);
    settingsRows.appendChild(row);
  }
}

// Recorder: while a chord button is armed, the next keydown becomes the
// binding. Registered before the engine listener; stopImmediatePropagation
// keeps the recorded chord from also firing its old or new action.
window.addEventListener(
  "keydown",
  (e) => {
    if (!recordingAction) return;
    e.preventDefault();
    e.stopImmediatePropagation();
    if (e.key === "Escape") {
      recordingAction = null;
      renderSettings();
      return;
    }
    if (["Meta", "Control", "Alt", "Shift"].includes(e.key)) return; // still holding modifiers
    const b = keymap.find((x) => x.action === recordingAction);
    recordingAction = null;
    if (e.key === "Backspace") {
      b.keys = null;
    } else {
      const parts = [];
      if (e.metaKey) parts.push("cmd");
      if (e.ctrlKey) parts.push("ctrl");
      if (e.altKey) parts.push("alt");
      if (e.shiftKey) parts.push("shift");
      parts.push(e.key.toLowerCase());
      b.keys = parts.join("+");
    }
    saveKeymap();
  },
  { capture: true }
);

// Engine: capture phase on window runs before xterm's own key handling, so a
// matched binding never leaks into the terminal. Dormant while the editor is
// open so trying out chords cannot fire actions.
window.addEventListener(
  "keydown",
  (e) => {
    if (!settingsEl.hidden) return;
    // Inputs swallow chords, except the find input: the chords printed in
    // the legend (⌘D, ⌘K, ⌘/) must fire while browsing.
    if (e.target instanceof HTMLInputElement && e.target !== findInput) return;
    const ctx = shellContext();
    for (const b of keymap) {
      if (!b.keys) continue;
      if (b.when !== "any" && b.when !== ctx) continue;
      if (!chordMatches(parseChord(b.keys), e)) continue;
      e.preventDefault();
      e.stopPropagation();
      ACTIONS[b.action]?.();
      return;
    }
  },
  { capture: true }
);

// ---- caffeinate toggle ----
// Server-side `caffeinate -di` tied to the shell's lifetime. The server owns
// the state; the button reflects it via the /api/sessions poll, so a second
// window stays in sync.

const caffeineBtn = document.getElementById("caffeine-btn");
let caffeineOn = false;

function setCaffeineState(on) {
  caffeineOn = Boolean(on);
  caffeineBtn.classList.toggle("on", caffeineOn);
  caffeineBtn.title = caffeineOn
    ? "mac kept awake (caffeinate -di), click to release"
    : "keep mac awake (caffeinate -di)";
}

caffeineBtn.onclick = async () => {
  const res = await fetch("/api/caffeinate", {
    method: "POST",
    headers: { "content-type": "application/json" },
    body: JSON.stringify({ on: !caffeineOn }),
  });
  if (res.ok) setCaffeineState((await res.json()).caffeinate);
};

// ---- orchestrator agent picker ----
// The chat session's command comes from the server (`agent` on /api/sessions),
// so the header always names the agent actually driving chat. Switching POSTs
// /api/agent: the server kills the chat tmux session and our reconnect
// respawns it with the new command. Previously used commands are remembered
// in localStorage as a one-click list.

const AGENT_STORE = "agentshell.agents";
const agentBtn = document.getElementById("agent-btn");
const agentPanel = document.getElementById("agent-panel");
const agentRows = document.getElementById("agent-rows");
const agentInput = document.getElementById("agent-input");
let agentCmd = null;

function loadAgents() {
  try { return JSON.parse(localStorage.getItem(AGENT_STORE)) ?? []; } catch { return []; }
}
function saveAgents(list) {
  localStorage.setItem(AGENT_STORE, JSON.stringify(list.slice(0, 8)));
}

function setAgentCmd(cmd) {
  if (cmd === agentCmd) return;
  agentCmd = cmd;
  agentBtn.textContent = "⌁ " + cmd;
  renderAgents();
}

function closeAgentPanel() {
  agentPanel.hidden = true;
  agentBtn.classList.remove("on");
}

agentBtn.onclick = () => {
  agentPanel.hidden = !agentPanel.hidden;
  agentBtn.classList.toggle("on", !agentPanel.hidden);
  if (!agentPanel.hidden) {
    settingsEl.hidden = true; // panels share the same corner
    keysBtn.classList.remove("on");
    renderAgents();
    agentInput.focus();
  }
};

agentInput.onkeydown = (e) => {
  e.stopPropagation();
  if (e.key === "Escape") closeAgentPanel();
  if (e.key === "Enter" && agentInput.value.trim()) switchAgent(agentInput.value.trim());
};

function renderAgents() {
  if (agentPanel.hidden) return;
  agentRows.innerHTML = "";
  const list = [...new Set([agentCmd, ...loadAgents()])].filter(Boolean);
  for (const cmd of list) {
    const row = document.createElement("div");
    row.className = "agent-row" + (cmd === agentCmd ? " current" : "");
    const pick = document.createElement("button");
    pick.className = "agent-cmd";
    pick.textContent = cmd;
    pick.title = cmd === agentCmd ? "current agent" : "switch the root agent to " + cmd;
    pick.onclick = () => switchAgent(cmd);
    row.appendChild(pick);
    if (cmd !== agentCmd) {
      const del = document.createElement("button");
      del.className = "agent-del";
      del.textContent = "×";
      del.title = "remove from list";
      del.onclick = () => {
        saveAgents(loadAgents().filter((c) => c !== cmd));
        renderAgents();
      };
      row.appendChild(del);
    }
    agentRows.appendChild(row);
  }
}

async function switchAgent(cmd) {
  if (cmd === agentCmd) {
    closeAgentPanel();
    if (!terms.has(CHAT)) show(CHAT); // retry after the fast-death guard tripped
    return;
  }
  if (!confirm(`Restart root main as "${cmd}"? The running root agent is killed.`)) return;
  const res = await fetch("/api/agent", {
    method: "POST",
    headers: { "content-type": "application/json" },
    body: JSON.stringify({ cmd }),
  });
  if (!res.ok) {
    alert(`switch failed: ${(await res.json()).error ?? res.status}`);
    return;
  }
  saveAgents([cmd, ...loadAgents().filter((c) => c !== cmd)]);
  agentInput.value = "";
  closeAgentPanel();
  setAgentCmd(cmd);
  chatDeaths = 0;
  // The server killed the chat session; drop the stale terminal and reconnect,
  // which recreates chat running the new command.
  dispose(CHAT);
  show(CHAT);
}

// Chrome only delivers reserved chords (cmd+w, cmd+t) to the page while it is
// fullscreen with the Keyboard Lock API engaged. Lock the keymap's keys; the
// lock sits dormant until the page goes fullscreen.
function lockKeymapKeys() {
  if (!navigator.keyboard?.lock) return;
  const codes = keymap
    .filter((b) => b.keys)
    .map((b) => parseChord(b.keys).key)
    .map((k) =>
      /^[a-z]$/.test(k) ? "Key" + k.toUpperCase() : /^[0-9]$/.test(k) ? "Digit" + k : null
    )
    .filter(Boolean);
  if (codes.length) navigator.keyboard.lock(codes).catch(() => {});
}
lockKeymapKeys();

// Outside fullscreen the browser still owns cmd+w. In a session that would
// silently close the whole app, so ask first; in chat, closing the tab is the
// intended meaning and stays silent.
window.addEventListener("beforeunload", (e) => {
  if (active !== CHAT) e.preventDefault();
});

// ---- voice control ----
// One key, spoken addressing. Hold ⌥ and speak, release to send; tap ⌥ to
// latch a longer recording, tap again to send; tap ⇧ while holding to promote
// the hold to a latch mid-utterance. The recording goes to /api/voice with the
// nodes the sidebar currently shows; the server transcribes it and routes the
// utterance: words for an agent travel verbatim (addressed by session or node
// name, focused session when unaddressed), shell verbs (view, spawn, kill,
// sidebar, caffeinate, agent switch, spoken answers) execute server-side.
// Actions only this page can perform (view, close_view, sidebar) come back in
// the response. The HUD pill narrates: listening -> transcribing -> result.

const micBtn = document.getElementById("mic-btn");
const hudEl = document.getElementById("voice-hud");
const hudTextEl = hudEl.querySelector(".vh-text");
let recorder = null;
let recChunks = [];
let recCancelled = false;
let pttHold = false;   // recording is held ⌥ push-to-talk (release sends)
let pttTimer = null;   // pending hold-to-arm timeout
let altClean = false;  // ⌥ is down with no other key pressed since
let hudTimer = null;

function hud(state, text) {
  clearTimeout(hudTimer);
  hudEl.className = "show " + state;
  hudTextEl.textContent = text;
  if (state === "done" || state === "error") hudTimer = setTimeout(() => (hudEl.className = ""), 6000);
}

// The node paths the shell currently shows (the tree's scope minus folds,
// plus every live session's node) — the user's mental model, shipped with
// every utterance so spoken names resolve to what they can see.
function visibleNodePaths() {
  const out = new Set();
  for (const s of lastSessions) if (s.node) out.add(s.node);
  const inScope = (p) => !treeScope || p === treeScope || p.startsWith(treeScope + "/");
  for (const n of vaultNodes) {
    if (!inScope(n.path)) continue;
    if ([...folded].some((f) => f && inScope(f) && n.path.startsWith(f + "/"))) continue;
    out.add(n.path);
  }
  return [...out];
}

async function startVoice(hold) {
  if (recorder) return;
  pttHold = hold;
  let stream;
  try {
    // Acquired per utterance, not held open: the OS mic indicator then tells
    // the truth about when the shell is actually listening.
    stream = await navigator.mediaDevices.getUserMedia({ audio: true });
  } catch {
    hud("error", "microphone blocked — allow it for this site in Safari settings");
    return;
  }
  const mime = ["audio/mp4", "audio/webm;codecs=opus", "audio/webm"].find((t) => MediaRecorder.isTypeSupported(t));
  recChunks = [];
  recCancelled = false;
  recorder = new MediaRecorder(stream, mime ? { mimeType: mime } : undefined);
  recorder.ondataavailable = (e) => { if (e.data.size) recChunks.push(e.data); };
  recorder.onstop = () => {
    stream.getTracks().forEach((t) => t.stop());
    const type = recorder.mimeType || mime || "audio/mp4";
    const cancelled = recCancelled;
    recorder = null;
    micBtn.classList.remove("rec");
    if (cancelled) {
      // A cancel explained in the HUD (chord cancel) must survive this stop
      // event; a plain cancel (esc, blur) just clears the pill.
      if (!hudEl.className.includes("error")) hudEl.className = "";
      return;
    }
    const blob = new Blob(recChunks, { type });
    if (blob.size < 1500) {
      hud("error", "heard nothing");
      return;
    }
    sendVoice(blob);
  };
  recorder.start();
  micBtn.classList.add("rec");
  hud(
    "listening",
    hold ? "listening — release ⌥ to send, ⇧ or ↑ locks" : "listening — tap ⌥ or click 🎙 to send, esc cancels"
  );
}

function stopVoice() {
  if (recorder && recorder.state === "recording") recorder.stop();
}

function cancelVoice() {
  if (!recorder) return;
  recCancelled = true;
  stopVoice();
}

function applyRouteResult(out) {
  for (const a of out.clientActions ?? []) {
    if (a.type === "view" && a.session) show(a.session);
    else if (a.type === "close_view") closeSessionView();
    else if (a.type === "sidebar") treeBtn.onclick();
  }
  refreshSessions();
  refreshVault();
  hud("done", `“${out.transcript}” — ${out.summary?.length ? out.summary.join("; ") : "no action"}`);
}

async function sendVoice(blob) {
  hud("busy", "transcribing…");
  try {
    const res = await fetch("/api/voice?focused=" + encodeURIComponent(active ?? CHAT), {
      method: "POST",
      headers: {
        "content-type": blob.type || "application/octet-stream",
        "x-visible-nodes": visibleNodePaths().join(",").slice(0, 4000),
      },
      body: blob,
    });
    const out = await res.json();
    if (!res.ok) throw new Error(out.error ?? "voice failed " + res.status);
    applyRouteResult(out);
  } catch (err) {
    hud("error", String(err.message ?? err));
  }
}

micBtn.onclick = () => (recorder ? stopVoice() : startVoice(false));

// One key, three gestures. Hold ⌥ 200ms: push-to-talk, release sends. Tap ⌥
// (up before the arm timer fires): latched recording, tap ⌥ again to send.
// Tap ⇧ while holding: promote the hold to a latch mid-utterance, so a talk
// that turns out long needs no restart. A real chord (⌥ plus another key)
// never trips any of it: the second key cancels the arm timer or discards an
// in-flight hold recording, and marks the ⌥ press dirty so its release cannot
// read as a tap — option-arrow word jumps keep working inside the terminal.
window.addEventListener(
  "keydown",
  (e) => {
    // The find input is exempt: ⌥ push-to-talk must work while browsing the
    // tree (the "instruct a node while looking at the tree" story).
    if ((e.target instanceof HTMLInputElement && e.target !== findInput) || !settingsEl.hidden || recordingAction) return;
    if (e.key === "Alt" && !e.metaKey && !e.ctrlKey && !e.repeat) {
      altClean = true;
      if (!recorder && !pttTimer) {
        pttTimer = setTimeout(() => {
          pttTimer = null;
          startVoice(true);
        }, 200);
      }
      return;
    }
    if (e.repeat) return;
    altClean = false;
    if (pttTimer && e.key !== "Shift") {
      clearTimeout(pttTimer);
      pttTimer = null;
    }
    if (recorder && pttHold && e.key !== "Alt") {
      // ⇧ or ↑ (the "slide up to lock" reflex) locks the hold into a latch.
      // Any other key means a real ⌥ chord: cancel, and say so — a silent
      // vanish reads as a bug.
      if (e.key === "Shift" || e.key === "ArrowUp") {
        e.preventDefault();
        e.stopPropagation();
        pttHold = false;
        hud("listening", "locked on — tap ⌥ or click 🎙 to send, esc cancels");
      } else {
        cancelVoice();
        hud("error", "cancelled (⌥ chord) — ⇧ or ↑ locks the recording");
      }
      return;
    }
    if (recorder && !pttHold && e.key === "Escape") {
      e.preventDefault();
      e.stopPropagation();
      cancelVoice();
    }
  },
  { capture: true }
);
window.addEventListener(
  "keyup",
  (e) => {
    if (e.key !== "Alt") return;
    const wasTap = Boolean(pttTimer);
    if (pttTimer) {
      clearTimeout(pttTimer);
      pttTimer = null;
    }
    if (recorder && pttHold) stopVoice(); // hold release: send
    else if (wasTap && !recorder) startVoice(false); // tap: start latched
    else if (recorder && !pttHold && altClean) stopVoice(); // tap during latch: send
    altClean = false;
  },
  { capture: true }
);
// A lost window (cmd+tab away) can never leave the mic hot.
window.addEventListener("blur", cancelVoice);

// ---- typed command lane ----
// The same grammar as voice, over a keyboard (talk ⌘K): type what you would
// have said ("megabranch, run the client build", "show me PG&E") and it
// routes identically through /api/command. For when speaking is not an option.

const cmdBar = document.getElementById("cmd-bar");
const cmdInput = document.getElementById("cmd-input");

// Instructing a node while looking at the tree is the planning workflow: the
// rail stays visible under the bar, and the tree updates in place as the
// agent writes outcomes.
function openCmdBar() {
  cmdBar.hidden = false;
  cmdInput.value = "";
  cmdInput.focus();
}

cmdInput.onkeydown = (e) => {
  e.stopPropagation();
  if (e.key === "Escape") return closeCmdBar();
  if (e.key === "Enter" && cmdInput.value.trim()) {
    const text = cmdInput.value.trim();
    closeCmdBar();
    sendCommand(text);
  }
};
cmdInput.onblur = () => closeCmdBar();

function closeCmdBar() {
  cmdBar.hidden = true;
  const e = active && terms.get(active);
  if (e && !stageOn) e.term.focus();
}

async function sendCommand(text) {
  hud("busy", "routing…");
  try {
    const res = await fetch("/api/command", {
      method: "POST",
      headers: { "content-type": "application/json" },
      body: JSON.stringify({ text, focused: active ?? CHAT, visibleNodes: visibleNodePaths() }),
    });
    const out = await res.json();
    if (!res.ok) throw new Error(out.error ?? "command failed " + res.status);
    applyRouteResult(out);
  } catch (err) {
    hud("error", String(err.message ?? err));
  }
}

// ---- the tree ----
// Nodes are what we talk about, outcomes are what we achieve, processes are
// what runs without a done condition (each node's "main" agent, builds).
// Sessions are never listed on their own: a session is the live state of the
// outcome or process it executes, worn as a dot on that row. Outcome state
// comes from the vault (/api/vault, each outcome exactly once under its
// topmost root, schema in ~/.tangent/trees/README.md), sessions joined in
// live. The tree is the ONE surface, rendered once, in the sidebar; ⌘/
// focuses its filter input and the work pane becomes the selected row's
// detail card. Selection never has side effects; opening a node's main agent
// or starting an outcome's agent is always its own visible action.

let vaultNodes = [];
let vaultMap = []; // the unified tree: each outcome once, grouped by root's home node
let vaultAt = 0;
let outcomeByFile = new Map(); // every outcome in the vault, by file path
let outcomeBySlug = new Map(); // and by slug, for breakdown children

async function fetchVault(force = false) {
  if (!force && vaultNodes.length && Date.now() - vaultAt < 5000) return vaultNodes;
  try {
    const res = await fetch("/api/vault");
    const data = await res.json();
    vaultNodes = data.nodes ?? [];
    vaultMap = data.map ?? [];
    outcomeByFile = new Map();
    outcomeBySlug = new Map();
    for (const g of vaultMap) {
      for (const t of g.outcomes) {
        outcomeByFile.set(t.file, t);
        if (!outcomeBySlug.has(t.slug)) outcomeBySlug.set(t.slug, t);
      }
    }
    // A scope whose node vanished falls back to the whole tree.
    if (treeScope && !vaultNodes.some((n) => n.path === treeScope)) setScope("");
    vaultAt = Date.now();
  } catch {}
  return vaultNodes;
}

// Deferred work stays out of every surface until asked for by name; dropped
// outcomes are already deleted, this just guards a stale index.
const visibleOutcomes = (n) => n.outcomes.filter((t) => t.status !== "deferred" && t.status !== "dropped");
const OUTCOME_GLYPH = { done: "✓", active: "▶", waiting: "◔", open: "○" };

// Next is derived, never stored: walking the flattened depth-first list, the
// first open outcome whose breakdown children are all finished. A parent with
// unfinished children is worked through its children first.
function deriveNext(list) {
  const bySlug = new Map(list.map((t) => [t.slug, t]));
  const unfinished = (slug) => {
    const c = bySlug.get(slug);
    return c && c.status !== "done" && c.status !== "dropped";
  };
  return list.find((t) => t.status === "open" && !(t.breakdown ?? []).some(unfinished)) ?? null;
}

// Rank nodes for "/query": name beats path beats people beats outcome text beats
// note body — "/sami" finds viz-input through its people or note content.
// Bare "/" lists nodes that still have something to do.
function rankNodes(q) {
  const query = q.toLowerCase().trim();
  const scored = [];
  for (const n of vaultNodes) {
    let s = 0;
    const name = n.name.toLowerCase();
    if (!query) s = visibleOutcomes(n).some((t) => t.status !== "done") ? 10 : 0;
    else if (name.startsWith(query)) s = 100;
    else if (name.includes(query)) s = 85;
    else if (n.path.toLowerCase().includes(query)) s = 70;
    else if ((n.people ?? "").toLowerCase().includes(query)) s = 55;
    else if (n.outcomes.some((t) => (t.title + " " + t.outcome).toLowerCase().includes(query))) s = 40;
    else if ((n.body ?? "").includes(query)) s = 25;
    if (s) scored.push({ n, s: s + Math.min(n.outcomes.length, 5) });
  }
  scored.sort((a, b) => b.s - a.s || a.n.path.localeCompare(b.n.path));
  return scored.slice(0, 5).map((x) => x.n);
}

// Folded node paths. Folding is the tree's one deliberate way to hide, so it
// persists across reloads; a folded node still shows what it hides (count +
// live glow) because activity must never silently disappear.
const FOLD_STORE = "agent-shell-map-folds";
const folded = new Set(JSON.parse(localStorage.getItem(FOLD_STORE) ?? "[]"));

function toggleFold(path) {
  if (folded.has(path)) folded.delete(path);
  else folded.add(path);
  localStorage.setItem(FOLD_STORE, JSON.stringify([...folded]));
  renderSidebar(true);
}

// The tree's scope: clicking a node views only that subtree — the user's own
// hands on what used to be "focus". Persisted so a reload lands where the
// eyes were.
const SCOPE_STORE = "agent-shell-tree-scope";
let treeScope = localStorage.getItem(SCOPE_STORE) ?? "";

/** Scopes the tree to one node's subtree ("" = everything). */
function setScope(path) {
  treeScope = path;
  localStorage.setItem(SCOPE_STORE, path);
  // Scoping answers the filter: clear it so the subtree shows whole.
  if (browsing) findInput.value = "";
  renderSidebar(true);
}

// The active-only filter: the tree shrinks to rows that need eyes — live
// agents, running services, active outcomes.
const LIVE_STORE = "agent-shell-live-only";
let liveOnly = localStorage.getItem(LIVE_STORE) === "1";
const liveBtn = document.getElementById("side-live");

function setLiveOnly(on) {
  liveOnly = on;
  localStorage.setItem(LIVE_STORE, on ? "1" : "0");
  liveBtn.classList.toggle("on", on);
  renderSidebar(true);
}
liveBtn.classList.toggle("on", liveOnly);
liveBtn.onclick = () => setLiveOnly(!liveOnly);

document.getElementById("talk-btn").onclick = () => openCmdBar();

// ---- find and browse ----
// The find input's focus IS browse mode. Entering: ⌘/ or clicking the input.
// While browsing, the tree carries a selection (arrows and hover), the work
// pane previews the selected row's card, and the legend prints every key.
// Leaving: esc, ⌘/ again, or anything that moves focus (opening a session,
// clicking the terminal).

/** ⌘/: into browsing, or back out of it. Opens the rail if it is closed. */
function toggleFind() {
  if (browsing) return exitBrowse();
  if (!sidebarEl.classList.contains("open")) treeBtn.onclick();
  findInput.focus();
}

function exitBrowse() {
  findInput.blur();
  const e = active && terms.get(active);
  if (e && !stageOn) e.term.focus();
}

findInput.onfocus = () => {
  if (browsing) return;
  browsing = true;
  sidebarEl.classList.add("browsing");
  renderSidebar(true);
  // Land the selection on what the work pane already shows. No scroll: a
  // click that entered browsing must not yank the pane elsewhere.
  const idx = sideItems.findIndex((it) =>
    stageOn ? it.kind === "outcome" && it.t.file === stageFile : Boolean(active) && itemSession(it) === active
  );
  sideSel = idx >= 0 ? idx : 0;
  paintSideSel(false);
  renderOutcomeStrip();
  renderKillBtn();
  fetchVault(true).then(() => renderSidebar(true));
};

// Clicking the tree's empty space also enters browsing, without touching any
// row's meaning.
panelEl.onmousedown = (e) => {
  if (e.target !== panelEl) return;
  e.preventDefault();
  findInput.focus();
};

findInput.onblur = () => {
  if (!browsing) return;
  browsing = false;
  sidebarEl.classList.remove("browsing");
  findInput.value = "";
  renderSidebar(true);
  renderCard(true);
  renderOutcomeStrip();
  renderKillBtn();
};

findInput.onkeydown = (e) => {
  e.stopPropagation();
  if (e.key === "Escape") return exitBrowse();
  if (e.key === "ArrowDown" || e.key === "ArrowUp") {
    e.preventDefault();
    moveSideSel(e.key === "ArrowDown" ? 1 : -1);
    return;
  }
  if (e.key === "ArrowLeft" || e.key === "ArrowRight") {
    // Fold or unfold the selected node. Only while the input is empty, so
    // the arrows keep their cursor meaning while filtering.
    const item = sideItems[sideSel];
    if (!findInput.value && item?.kind === "main" && item.foldable) {
      e.preventDefault();
      if (folded.has(item.g.path) !== (e.key === "ArrowLeft")) toggleFold(item.g.path);
    }
    return;
  }
  if (e.key === "Backspace" && !findInput.value && treeScope) {
    // Up a level, out of the scoped subtree.
    e.preventDefault();
    setScope(treeScope.split("/").slice(0, -1).join("/"));
    return;
  }
  if (e.key === "Enter") {
    const item = sideItems[sideSel];
    if (item) activateTreeItem(item);
  }
};
findInput.oninput = () => renderSidebar(true);

/** The live session executing an outcome, joined by tmux session name. */
const sessionFor = (name) => (name ? lastSessions.find((s) => s.name === name) ?? null : null);

/**
 * The sections the tree shows, in order. Bare: every vault node in tree order
 * (root first when unscoped), indented by depth, each with its outcomes (from
 * the deduplicated vault map, so an outcome renders once under its topmost
 * root). Scoped: only the scoped node and its descendants, re-based to depth
 * 0. Typed: ranked node matches — name beats path beats people beats outcome
 * text beats note body.
 */
function treeSections(q) {
  if (q) {
    return rankNodes(q).map((n) => ({ path: n.path, name: n.path, purpose: n.purpose, depth: 0, outcomes: visibleOutcomes(n) }));
  }
  const groupByPath = new Map(vaultMap.map((g) => [g.path, g]));
  const baseDepth = treeScope ? treeScope.split("/").length - 1 : 0;
  const sections = [];
  if (!treeScope) {
    sections.push({ path: "", name: "root", purpose: "the whole tree — root main organizes it", depth: 0, outcomes: [] });
  }
  for (const n of vaultNodes) {
    if (treeScope && !(n.path === treeScope || n.path.startsWith(treeScope + "/"))) continue;
    sections.push({
      path: n.path,
      name: n.path.split("/").pop(),
      purpose: n.purpose,
      depth: n.path.split("/").length - 1 - baseDepth,
      outcomes: visibleOutcomes(groupByPath.get(n.path) ?? { outcomes: [] }),
    });
  }
  return sections;
}

/** One outcome row in the tree: glyph, title, live dot. */
function outcomeRowEl(t, isNext, indent) {
  const row = document.createElement("div");
  row.className = "bt-row " + t.status + (isNext ? " next" : "");
  row.style.paddingLeft = indent + (t.depth ?? 0) * 16 + "px";
  const s = sessionFor(t.session);
  const glyph = document.createElement("span");
  glyph.className = "bt-glyph" + (s?.state === "working" ? " working" : s?.state === "waiting" ? " ready" : "");
  glyph.textContent = s ? "●" : OUTCOME_GLYPH[t.status] ?? "○";
  const title = document.createElement("span");
  title.className = "bt-title";
  title.textContent = t.title;
  if (t.outcome) title.title = "done = " + t.outcome;
  row.append(glyph, title);
  if (t.foreign) {
    const chip = document.createElement("span");
    chip.className = "bt-node";
    chip.textContent = t.foreign;
    chip.title = "lives on " + t.node;
    row.appendChild(chip);
  }
  if (isNext) {
    const tag = document.createElement("span");
    tag.className = "bt-next-tag";
    tag.textContent = "next";
    row.appendChild(tag);
  } else {
    const meta = t.status === "waiting" && t.waitingOn ? "waiting on " + t.waitingOn : t.due ?? "";
    if (meta) {
      const m = document.createElement("span");
      m.className = "bt-meta";
      m.textContent = meta;
      row.appendChild(m);
    }
  }
  if (s) row.appendChild(killBtnEl(s.name));
  return row;
}

/** The scoped tree's way back up: one row, first in the tree. */
function upRowEl(to) {
  const row = document.createElement("div");
  row.className = "bt-row up-row";
  const glyph = document.createElement("span");
  glyph.className = "bt-glyph";
  glyph.textContent = "‹";
  const title = document.createElement("span");
  title.className = "bt-title";
  title.textContent = "up to " + (to ? to.split("/").pop() : "the whole tree");
  const meta = document.createElement("span");
  meta.className = "bt-meta";
  meta.textContent = "⌫";
  row.append(glyph, title, meta);
  return row;
}

/**
 * A node's header row IS its main-agent row: fold chevron, a state dot only
 * while the main agent is live, the name, purpose text, and — when folded —
 * a dim count of the hidden rows, glowing if any hidden agent is live so
 * nothing active ever disappears from view.
 */
function nodeRowEl(g, s, fold) {
  const row = document.createElement("div");
  row.className = "cr-node";
  row.style.paddingLeft = 8 + g.depth * 16 + "px";
  row.title = g.path || "root";
  const chev = document.createElement("span");
  chev.className = "cr-fold";
  if (fold.foldable) {
    chev.textContent = fold.folded ? "▸" : "▾";
    chev.onmousedown = (e) => {
      e.preventDefault();
      e.stopPropagation();
      toggleFold(g.path);
    };
  }
  row.appendChild(chev);
  if (s) {
    const glyph = document.createElement("span");
    glyph.className = "bt-glyph" + (s.state === "working" ? " working" : s.state === "waiting" ? " ready" : "");
    glyph.textContent = "●";
    row.appendChild(glyph);
  }
  const name = document.createElement("span");
  name.className = "cr-path";
  name.textContent = g.name;
  const purpose = document.createElement("span");
  purpose.className = "cr-purpose";
  purpose.textContent = g.purpose ?? "";
  const meta = document.createElement("span");
  meta.className = "cr-meta" + (fold.folded && fold.hiddenLive ? " live" : "");
  meta.textContent = fold.folded
    ? fold.hiddenCount + " hidden" + (fold.hiddenLive ? " · live" : "")
    : s ? STATE_HINT[s.state] ?? "" : "";
  row.append(name, purpose, meta);
  // Root main is the shell's home: it has no kill, here or anywhere.
  if (s && !s.isChat && s.name !== CHAT) row.appendChild(killBtnEl(s.name));
  return row;
}

/** A process session row (service, plain shell) under its node. */
function processRowEl(s, indent) {
  const row = document.createElement("div");
  row.className = "bt-row";
  row.style.paddingLeft = indent + "px";
  const glyph = document.createElement("span");
  glyph.className =
    "bt-glyph" + (["working", "service"].includes(s.state) ? " working" : s.state === "waiting" ? " ready" : "");
  glyph.textContent = ["working", "waiting", "service"].includes(s.state) ? "●" : "○";
  const title = document.createElement("span");
  title.className = "bt-title";
  title.textContent = s.name;
  const meta = document.createElement("span");
  meta.className = "bt-meta";
  meta.textContent = STATE_HINT[s.state] ?? "";
  row.append(glyph, title, meta);
  row.appendChild(killBtnEl(s.name));
  return row;
}

/**
 * THE tree, as data rows. The sidebar renders exactly this list: node
 * headers wearing their main agent's dot, outcomes nested by breakdown,
 * process sessions underneath. `treeScope` narrows it to one node's subtree
 * (clicking a node row scopes; the up row leads back); `liveOnly` keeps only
 * rows with something running or active (flattened, like search: folds are
 * ignored); a typed query replaces it with ranked node matches.
 */
function buildTreeItems(q) {
  const sections = treeSections(q);
  const inScope = (p) => !treeScope || p === treeScope || p.startsWith(treeScope + "/");
  /** True when a folded ancestor (inside the scope) hides this path entirely. */
  const foldedAway = (path) => [...folded].some((f) => f && inScope(f) && path.startsWith(f + "/"));
  const flat = !q && liveOnly;
  const items = [];
  if (!q && treeScope) items.push({ kind: "up", to: treeScope.split("/").slice(0, -1).join("/") });
  for (const g of sections) {
    if (!q && !flat && g.path && foldedAway(g.path)) continue;
    const pad = 8 + g.depth * 16;
    const rowPad = pad + 20; // children start under the header's name
    const home = g.path
      ? lastSessions.find((x) => x.kind === "home" && x.node === g.path)
      : lastSessions.find((x) => x.isChat);
    const procs = lastSessions.filter(
      (s) => (s.node ?? "") === g.path && !s.isChat && !s.outcome && s.kind !== "home"
    );
    const kids = q ? [] : sections.filter((o) => o.path && o.path !== g.path && o.path.startsWith(g.path + "/"));
    const foldable = !q && !flat && Boolean(g.path) && Boolean(g.outcomes.length || procs.length || kids.length);
    const fold = { foldable, folded: foldable && folded.has(g.path), hiddenCount: 0, hiddenLive: false };
    if (fold.folded) {
      const descProcs = lastSessions.filter(
        (s) => (s.node ?? "").startsWith(g.path + "/") && !s.isChat && !s.outcome && s.kind !== "home"
      ).length;
      fold.hiddenCount =
        g.outcomes.length + procs.length + descProcs +
        kids.length + kids.reduce((n, k) => n + k.outcomes.length, 0);
      fold.hiddenLive = lastSessions.some((s) => {
        const n = s.node ?? "";
        const under = n === g.path ? !(s.kind === "home" || s.isChat) : n.startsWith(g.path + "/");
        return under && ["working", "waiting", "service"].includes(s.state);
      });
    }
    const next = deriveNext(g.outcomes);
    const rows = [
      ...g.outcomes.map((t) => ({ kind: "outcome", t, g, next: t === next, pad: rowPad })),
      ...procs.map((s) => ({ kind: "process", s, g, pad: rowPad })),
    ];
    if (flat) {
      const live = rows.filter((it) =>
        it.kind === "outcome"
          ? Boolean(sessionFor(it.t.session)) || it.t.status === "active"
          : ["working", "waiting", "service"].includes(it.s.state)
      );
      const homeLive = home && ["working", "waiting", "service"].includes(home.state);
      if (!live.length && !homeLive) continue;
      items.push({ kind: "main", g, s: home ?? null, foldable: false, fold: { foldable: false, folded: false, hiddenCount: 0, hiddenLive: false } });
      items.push(...live);
      continue;
    }
    items.push({ kind: "main", g, s: home ?? null, foldable, fold });
    if (fold.folded) continue;
    items.push(...rows);
  }
  return items;
}

/** The DOM row for one tree item. */
function treeRowEl(item) {
  if (item.kind === "up") return upRowEl(item.to);
  if (item.kind === "main") return nodeRowEl(item.g, item.s, item.fold);
  if (item.kind === "outcome") return outcomeRowEl(item.t, item.next, item.pad);
  return processRowEl(item.s, item.pad);
}

/**
 * One meaning per row, and none of them spawns: a node row scopes the tree to
 * its subtree (opening its main agent is an explicit detail-pane action), an
 * outcome row shows the work (its live session, else the stage), a process
 * row shows its session, the up row goes back up.
 */
function activateTreeItem(item) {
  if (item.kind === "up") {
    setScope(item.to);
    return;
  }
  if (item.kind === "main") {
    // Root's subtree IS the whole tree; its one meaning is root main.
    if (!item.g.path) show(CHAT);
    else setScope(item.g.path);
    return;
  }
  if (item.kind === "outcome") {
    const s = sessionFor(item.t.session);
    if (s) show(s.name);
    else {
      // Pin the outcome's card: it survives leaving browse mode.
      findInput.blur();
      openOutcomeView(item.t.file);
    }
    return;
  }
  show(item.s.name);
}

/** Opens (spawning if needed) a node's main agent and views it. */
async function openNodeMain(nodePath) {
  hud("busy", "opening main…");
  try {
    const res = await fetch("/api/node/open", {
      method: "POST",
      headers: { "content-type": "application/json" },
      body: JSON.stringify({ node: nodePath }),
    });
    const out = await res.json();
    if (!res.ok) throw new Error(out.error ?? "failed " + res.status);
    await refreshSessions();
    show(out.session);
    hud("done", "main · " + nodePath);
  } catch (err) {
    hud("error", String(err.message ?? err));
  }
}

// ---- outcome strip ----
// During flow you need almost nothing on screen: just what the viewed
// session is for. Full context lives on the tree and the card.

const stripEl = document.getElementById("outcome-strip");
const stripNodeEl = stripEl.querySelector(".ts-node");
const stripTitleEl = stripEl.querySelector(".ts-title");
const stripOutcomeEl = stripEl.querySelector(".ts-outcome");
let stripShown = false;

function renderOutcomeStrip() {
  const s = lastSessions.find((x) => x.name === active);
  // The strip describes only what the work pane shows: hidden while a card
  // (browse preview or pinned outcome) covers the terminal.
  const on = Boolean(!stageOn && !browsing && s && !s.isChat && (s.outcome || s.goal));
  if (on) {
    stripNodeEl.textContent = "[" + ((s.node ?? "").split("/").pop() || "?") + "]";
    stripTitleEl.textContent = s.outcomeTitle ?? "";
    stripOutcomeEl.textContent = s.outcome ? (s.outcomeText ? "outcome: " + s.outcomeText : "") : s.goal;
  }
  stripEl.classList.toggle("show", on);
  if (on !== stripShown) {
    stripShown = on;
    refitActive();
  }
}

window.addEventListener("resize", refitActive);

// Opening state: root main with the tree beside it, exactly as it will look
// all day. Find is one ⌘/ away.
paintChordHints();
show(CHAT);
refreshSessions();
refreshVault();
setInterval(refreshSessions, 2000);
setInterval(refreshVault, 3000);
</script>
</body>
